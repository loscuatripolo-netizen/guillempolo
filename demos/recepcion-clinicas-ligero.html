<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recepción automática para clínicas</title>
<meta name="description" content="Reservas, recordatorios, lista de espera, asistente 24 h y reseñas de Google para clínicas. Demo con datos de ejemplo.">
<style>
@font-face{font-family:"Archivo";src:url("/fuentes/archivo.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("/fuentes/instrument-sans.woff2") format("woff2");font-weight:400 700;font-display:swap}
/* Layout: barra superior (clínica, plan, cambio Panel / Lo que ve el paciente) · panel = menú lateral + contenido (máx. 1180) · paciente = tres móviles: Google Maps, su web, su WhatsApp */
:root{
  --acc:#0E6E66; --acc-ink:#0A4F49; --acc-soft:#E3F0EE; --acc-line:#B9D9D5;
  --bg:#F4F6F5; --panel:#FFFFFF; --ink:#16211F; --muted:#68746F; --line:#E2E8E5; --soft:#F0F3F2;
  --ok:#1D7A46; --ok-soft:#E2F2E8; --warn:#9A6208; --warn-soft:#FAEFD9; --bad:#B4462F; --bad-soft:#F9E6E1; --star:#E0A016;
  --wa:#1FA855; --wa-bg:#EEE8DF; --wa-in:#FFFFFF; --wa-out:#DCF7DF;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif; --f-b:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-s:10px; --sh:0 1px 2px rgba(22,33,31,.05),0 14px 34px -14px rgba(22,33,31,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{flex:none}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.marca{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 16px var(--f-d);flex:none}
.marca b{font:650 17px var(--f-d);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.marca small{color:var(--muted);font-size:12.5px;display:block}
.plan{font-size:11.5px;font-weight:650;letter-spacing:.04em;padding:4px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-ink);white-space:nowrap}
.demo{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:7px 15px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(22,33,31,.12)}
.tour{display:flex;gap:8px;padding:0 22px 12px;max-width:1440px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tour::-webkit-scrollbar{display:none}
.tour .lab{font-size:12.5px;color:var(--muted);align-self:center;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tour button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.tour button i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.tour button:hover{border-color:var(--acc-line);background:var(--acc-soft)}

/* ---------- panel de la clínica ---------- */
.clin{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{padding:20px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:118px;align-self:start}
.side button{display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14.5px}
.side button svg{width:19px;height:19px}
.side button:hover{color:var(--ink)}
.side button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(22,33,31,.06),inset 0 0 0 1px var(--line)}
.side button[aria-current="page"] svg{color:var(--acc)}
.side .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .pie{margin-top:18px;padding:14px;border-radius:12px;border:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
main{padding:26px clamp(16px,3vw,36px) 100px;min-width:0;max-width:1180px}
.h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.h h1{font-size:clamp(23px,2.6vw,29px);font-weight:650;margin-top:4px}
.h p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font:650 27px/1.1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ok)}
.kpi em.w{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card>h2{font-size:16.5px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 small{font:500 13px var(--f-b);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#C9D2CE}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.s{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.g{border-color:transparent;background:none;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.wa{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--soft);color:var(--muted)} .pill.ac{background:var(--acc-soft);color:var(--acc-ink)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .t{font:650 14.5px var(--f-d);width:46px;font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:650 12.5px var(--f-d);flex:none;color:#fff}
.row .who{flex:1;min-width:150px}
.row .who b{display:block;font-weight:600}
.row .who small{color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;vertical-align:middle}
.feed{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto}
.ev{display:grid;grid-template-columns:42px 24px 1fr;gap:9px;font-size:14px;align-items:start}
.ev i{font-style:normal;font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.ev .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.aviso{border:1px solid #EBD8B2;background:var(--warn-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso b{color:var(--warn)}

/* agenda */
.ag-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ag{display:grid;min-width:720px}
.ag .c{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;min-height:48px}
.ag .hd{font-weight:600;font-size:13px;padding:10px;background:var(--soft)}
.ag .hr{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:7px 9px}
.slot{width:100%;height:100%;min-height:40px;border:0;border-radius:8px;text-align:left;padding:5px 8px;font-size:12px;line-height:1.3;display:block}
.slot.libre{background:transparent;color:transparent}
.slot.libre:hover,.slot.libre:focus-visible{background:var(--acc-soft);color:var(--acc-ink)}
.slot b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.anulada{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 6px,var(--panel) 6px,var(--panel) 12px);color:var(--bad)}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600}
.dias button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);width:100%}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;width:90px;flex:none}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.wa-box{background:var(--wa-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.wa-msg{background:var(--wa-in);border-radius:10px 10px 10px 3px;padding:7px 10px;font-size:13.5px;max-width:90%;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-line}
.wa-msg.yo{align-self:flex-end;background:var(--wa-out);border-radius:10px 10px 3px 10px}
.wa-msg small{display:block;color:var(--muted);font-size:10.5px;text-align:right}
.rs{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:8px}
.rs .cab{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.st{color:var(--star);letter-spacing:1px;font-size:14px}
.st span{color:#D5DCD9}
.rs textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);resize:vertical;line-height:1.5}
.rs .resp{background:var(--acc-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.rs .resp b{display:block;font-size:12.5px;color:var(--acc-ink);margin-bottom:2px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--acc-line);background:var(--acc-soft)}
.opt small{color:var(--muted);display:block;font-size:12.5px}

/* ---------- lo que ve el paciente ---------- */
.esc{max-width:1240px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 80px}
.esc-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.esc-h h1{font-size:clamp(23px,2.6vw,29px);font-weight:650;margin-top:4px}
.esc-h p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.cap{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:600;font-size:14px}
.cap span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:650 12px var(--f-d)}
.cap small{color:var(--muted);font-weight:500}
.mov{background:#fff;border-radius:34px;padding:9px;box-shadow:var(--sh),inset 0 0 0 1px var(--line);max-width:330px;margin:0 auto;width:100%}
.pant{border-radius:26px;overflow:hidden;height:620px;position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line)}
.pant .scroll{flex:1;overflow:auto;scrollbar-width:none}
.pant .scroll::-webkit-scrollbar{display:none}
.estado{display:flex;justify-content:space-between;padding:8px 18px 4px;font:600 11.5px var(--f-b);color:var(--ink)}
/* maps */
.gm-foto{height:132px;background:linear-gradient(135deg,var(--acc-soft),#E9EEEC 60%,#F6F2EA);display:grid;place-items:center;color:var(--muted);font-size:12px;position:relative}
.gm-foto:after{content:"Aquí irían sus fotos";position:absolute;bottom:8px;right:10px;font-size:11px;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:99px}
.gm{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.gm h3{font:600 20px var(--f-b);letter-spacing:0}
.gm .rt{display:flex;align-items:center;gap:6px;font-size:13.5px}
.gm .rt b{font-weight:600}
.gm .sub{font-size:13px;color:var(--muted)}
.gm .ab{font-size:13px}.gm .ab b{color:#188038;font-weight:600}
.gm-acc{display:flex;gap:8px;padding:6px 16px 14px;overflow-x:auto;scrollbar-width:none}
.gm-acc button{flex:none;border:1px solid #DADCE0;background:#fff;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;color:#1A73E8;display:flex;align-items:center;gap:6px}
.gm-acc button.res{background:#1A73E8;border-color:#1A73E8;color:#fff}
.gm-tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid #E8EAED;font-size:13.5px;font-weight:600;color:#5F6368}
.gm-tabs span{padding:10px 0}.gm-tabs span.on{color:#1A73E8;box-shadow:inset 0 -2px 0 #1A73E8}
.gm-r{padding:14px 16px;border-bottom:1px solid #F1F3F4;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.gm-r .q{display:flex;gap:9px;align-items:center}
.gm-r .q .av{width:28px;height:28px;font-size:11px}
.gm-r .pr{background:#F8F9FA;border-radius:8px;padding:8px 10px;font-size:13px}
.gm-r .pr b{display:block;font-size:12px}
.gm-esc{margin:12px 16px 18px;border:1px solid #DADCE0;border-radius:99px;padding:9px;text-align:center;font-weight:600;color:#1A73E8;font-size:13.5px;background:#fff;width:calc(100% - 32px)}
/* web */
.wb-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.wb-top b{font:650 15px var(--f-d)}
.wb-hero{padding:22px 18px 10px}
.wb-hero .eyebrow{font-size:11px}
.wb-hero h3{font:650 25px/1.1 var(--f-d);margin:6px 0 8px}
.wb-hero p{margin:0 0 12px;color:var(--muted);font-size:14px}
.wb-badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.wb-img{margin:4px 18px 14px;height:150px;border-radius:16px;background:linear-gradient(160deg,var(--acc-soft),#EFE9E1);position:relative}
.wb-img:after{content:"Aquí irían sus fotos";position:absolute;bottom:8px;left:10px;font-size:11px;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:99px;color:var(--muted)}
.wb-srv{padding:0 18px 90px;display:flex;flex-direction:column;gap:8px}
.wb-srv div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.fab{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;z-index:3}
.fab .cita{flex:1;border:0;background:var(--acc);color:#fff;border-radius:99px;padding:13px;font-weight:650;font-size:14.5px;box-shadow:0 8px 20px -8px var(--acc)}
.fab .chat{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.fab .chat:after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#39D37A;border:2px solid var(--ink)}
/* whatsapp */
.wp-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F7F7F7;border-bottom:1px solid #E6E6E6}
.wp-top .av{width:34px;height:34px;background:var(--acc)}
.wp-top b{display:block;font-size:14px}
.wp-top small{font-size:11.5px;color:var(--muted)}
.wp{background:var(--wa-bg);flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.wp::-webkit-scrollbar{display:none}
.wp .dia{align-self:center;font-size:11px;background:#fff;border-radius:6px;padding:3px 8px;color:var(--muted);margin:4px 0}
.wp .wa-msg{font-size:13px}
.wp .link{display:block;margin-top:6px;border-top:1px solid #EEE;padding-top:6px;color:#0B7FD1;font-weight:600}
/* hoja dentro del móvil */
.hoja{position:absolute;inset:0;background:rgba(15,22,21,.35);display:flex;align-items:flex-end;z-index:5}
.hoja .in{background:#fff;width:100%;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.hoja .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.hoja .hd b{font:650 15.5px var(--f-d)}
.hoja .hd button{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}
.hoja .bd{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:4px;padding:0 16px 10px}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--acc)}
.step{font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.svc{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;text-align:left;width:100%}
.svc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.svc small{display:block;color:var(--muted);font-size:12px}
.qk{display:flex;flex-wrap:wrap;gap:6px}
.qk button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.qk button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.day{flex:none;width:52px;border:1px solid var(--line);border-radius:12px;padding:7px 2px;text-align:center;background:#fff}
.day b{display:block;font:650 17px var(--f-d)}
.day small{font-size:10.5px;color:var(--muted);text-transform:capitalize;display:block}

var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  if(!s||typeof s!=='string')return null;

function respuesta(r,v){
  v=v||0;var n=String(r.a).split(' ')[0];n=n.charAt(0).toUpperCase()+n.slice(1);var t=norm(r.t);
  var pro=CFG.pros.find(function(p){return t.indexOf(norm(p.n))>-1});
  var Z={espalda:'la espalda',lumbar:'la zona lumbar',cervical:'las cervicales',cuello:'el cuello',rodilla:'la rodilla',hombro:'el hombro',tobillo:'el tobillo',cadera:'la cadera',ciatica:'la ciática',contractura:'esa contractura',pie:'el pie',muneca:'la muñeca'};
  var k=Object.keys(Z).find(function(x){return new RegExp('\\b'+x).test(t)});
  var firma='\n— Equipo de '+CFG.nombre;
  if(r.s>=4){
    var a=[['¡Muchas gracias, '+n+'!','Gracias por tu reseña, '+n+'.','¡Qué alegría leerte, '+n+'!'][v%3]];
    if(k)a.push('Nos alegra mucho que notes mejoría en '+Z[k]+'.');
    else if(/deport|lesi|correr|futbol|entren/.test(t))a.push('Nos alegra que vuelvas a entrenar sin molestias.');
    else if(/trato|amab|cercan|atenci/.test(t))a.push('Que salgáis contentos es lo que más nos importa.');
    if(pro)a.push('Se lo diremos a '+pro.n+', le hará mucha ilusión.');
    if(/hora|esper|cambi/.test(t)&&r.s<5)a.push('Tomamos nota de lo que nos cuentas para mejorar.');
    a.push(['Te esperamos cuando lo necesites.','Aquí estamos para lo que necesites.','¡Hasta pronto!'][v%3]);
    return a.join(' ')+firma;
  }
  var b=['Hola '+n+', gracias por contárnoslo y perdona las molestias.'];
  if(/espera|tard|retras|puntual/.test(t))b.push('No deberías haber esperado: lo estamos revisando para que no vuelva a pasar.');
  if(/cambi|anul|cita/.test(t))b.push('Sentimos los cambios de hora; queremos que no vuelva a ocurrir.');
  if(/precio|caro|cobr/.test(t))b.push('Si algo del precio no quedó claro, te lo explicamos sin problema.');
  b.push('Nos gustaría hablarlo contigo: escríbenos al '+CFG.tel+' y lo vemos.');
  return b.join(' ')+firma;
}

function barras(datos,colA,colB,W,H){
  var max=Math.max.apply(null,datos.map(function(s){return s.a+(s.b||0)}))||1,n=datos.length,bw=Math.min(64,(W-40)/n*.55),gap=(W-40-bw*n)/Math.max(1,n-1);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;display:block" role="img">'+'<line x1="16" y1="'+(H-28)+'" x2="'+(W-8)+'" y2="'+(H-28)+'" stroke="var(--line)"/>'+datos.map(function(s,i){
    var x=20+i*(bw+gap),ha=s.a/max*(H-62),hb=(s.b||0)/max*(H-62),yb=H-28;
    return '<rect x="'+x+'" y="'+(yb-ha)+'" width="'+bw+'" height="'+ha+'" rx="5" fill="'+colA+'"/>'+(hb?'<rect x="'+x+'" y="'+(yb-ha-hb-2)+'" width="'+bw+'" height="'+hb+'" rx="5" fill="'+colB+'"/>':'')+
      '<text x="'+(x+bw/2)+'" y="'+(yb-ha-hb-8)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+(s.top!=null?s.top:s.a)+'</text><text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+s.lab+'</text>'}).join('')+'</svg>'}

  var origen=Object.keys(porO).sort(function(a,b){return porO[b]-porO[a]}).map(function(o){return fila(esc(o),porO[o],porO[o]/oMax*100)}).join('');

/* ---------- movimiento: qué es nuevo desde el último pintado ---------- */
var SEQ=0,FX={kpi:{},bad:{}};
var REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function sellar(){
  [S.log,S.wa,S.resenas,S.chat,S.preg,S.citas,S.ofertas].forEach(function(a){a.forEach(function(x){if(x&&!x.n)x.n=++SEQ})});
  if(S.hoja&&!S.hoja.n)S.hoja.n=++SEQ;
  if(S.seqPrev==null)S.seqPrev=SEQ;
  var k=S.modo==='clin'?'c-'+S.tab:'p',ent=k!==FX.vista;FX.vista=k;return ent;
}
function nu(x){return x&&x.n>S.seqPrev?' nuevo':''}
function fx(ent){
  var app=$('#app');app.classList.toggle('entra',!!ent&&!REDUCE&&!!FX.listo);
  /* cifras que suben */
  [].forEach.call(document.querySelectorAll('.kpi'),function(k){
    var b=k.querySelector('b'),l=k.querySelector(':scope>span'),tn=b&&b.firstChild;if(!tn||tn.nodeType!==3||!l)return;
    var m=tn.nodeValue.match(/^(\+?)(\d[\d.]*(?:,\d+)?)([\s\S]*)$/);if(!m)return;
    var raw=m[2],dec=(raw.split(',')[1]||'').length,val=parseFloat(raw.replace(/\./g,'').replace(',','.'));
    var key=FX.vista+'|'+l.textContent,prev=FX.kpi[key];FX.kpi[key]=val;
    var from=ent?0:prev;if(from==null||from===val||REDUCE)return;
    if(!ent)k.classList.add('cambia');

    var t0=performance.now(),dur=ent?900:650;tn.nodeValue=m[1]+fmt(from)+m[3];

  if(E&&E.paso==='srv'){var s=CFG.servicios.find(function(z){return norm(z.n)===t});if(s){var ds=[],x=addD(HOY,-1);for(var g=0;ds.length<4&&g<30;g++){x=addD(x,1);if(abre(x)&&libres(x).length)ds.push(x)}E.srv=s.id;E.paso='dia';E.dias=ds.map(iso);bot('¿Qué día te va mejor?',ds.map(function(d){return DCORTO[d.getDay()]+' '+d.getDate()}));return}}
  if(E&&E.paso==='dia'){var i=E.dias.findIndex(function(di){var d=deIso(di);return (DCORTO[d.getDay()]+' '+d.getDate())===txt});if(i>-1){E.dia=E.dias[i];E.paso='hora';bot('Estos son los huecos libres:',libres(deIso(E.dia)).slice(0,8).map(function(z){return z.h}));return}}
  if(E&&E.paso==='hora'&&/^\d\d:\d\d$/.test(txt)){var l=libres(deIso(E.dia)).find(function(z){return z.h===txt});if(l){E.h=txt;E.pro=l.pro;E.paso='nombre';E.srv=E.srv||'fis';bot('Te reservo el '+fD(deIso(E.dia))+' a las '+txt+' con '+PRO(l.pro).n+'. ¿A nombre de quién?');return}}
  if(/hora|abr|cierr|abiert/.test(t)&&!/cita|reserv|hueco/.test(t)){bot('Nuestro horario:\n'+horarioTxt(),['Pedir cita','¿Dónde estáis?']);regPreg(txt,'Horario');return}
  if(/precio|cuest|cuant|tarifa|vale/.test(t)){bot(CFG.servicios.map(function(s){return s.n+': '+s.precio+' €'}).join('\n')+(CFG.preciosEj&&REAL?'\n\n(Precios de ejemplo: aquí irían los vuestros.)':''),['Pedir cita','Horario']);regPreg(txt,'Precios');return}
  if(/donde|direcc|llegar|aparc|ubica/.test(t)){bot('Estamos en '+CFG.direccion+'. Si necesitas algo más para llegar, escríbenos al '+CFG.tel+'.',['Pedir cita','Horario']);regPreg(txt,'Dirección y cómo llegar');return}
  if(/mutua|seguro|sanitas|adeslas|asisa|dkv|mapfre/.test(t)){bot('Eso prefiero que te lo confirme la clínica, para no decirte nada que no sea. Ya les he pasado tu pregunta; también puedes escribirles al '+CFG.tel+'.',['Pedir cita','Precios']);regPreg(txt,'Pasada a vuestro WhatsApp','wa');log('Pregunta del asistente pasada a tu WhatsApp: «'+txt+'»','acc');return}
  if(/anul|cambi|mover/.test(t)){if(LIG){bot('Puedes cambiarla o anularla desde tu cita de '+CFG.sistema+', o escribiendo al '+CFG.tel+'.',['Pedir cita','Horario'],['Ir a mi cita','d-ir']);regPreg(txt,'Enlace a '+CFG.sistema);return}S.chatEstado={paso:'anular-tel'};bot('Claro. ¿Con qué móvil hiciste la reserva?');return}
  if(/trat|lesion|dolor|espalda|rodilla|hombro|suelo|deport|puncion|cuello/.test(t)&&!/cita|reserv/.test(t)){bot('Tratamos: '+CFG.servicios.slice(1).map(function(s){return s.n.toLowerCase()}).join(', ')+'. Si es tu primera vez, se empieza con una valoración.',['Pedir cita','Precios']);regPreg(txt,'Tratamientos');return}
  if(/cita|reserv|hueco|pedir|manana|tarde|jueves|lunes|martes|miercoles|viernes/.test(t)){
    if(LIG){S.clicsRes++;bot('¡Claro! Puedes elegir día y hora ahora mismo, con los huecos libres de verdad:',['Horario','Precios'],['Ver huecos y reservar','d-ir']);regPreg(txt,'Le manda a reservar en '+CFG.sistema,'cita');log('El asistente ha mandado a reservar a '+CFG.sistema+' («'+txt+'»)','acc');return}
    var tarde=/tarde/.test(t),man=/manana/.test(t);
    if(man){var ops=libres(MANANA).filter(function(x){return !tarde||toMin(x.h)>=15*60}).slice(0,6);
      if(ops.length){S.chatEstado={paso:'hora',srv:'fis',dia:iso(MANANA)};bot('Mañana'+(tarde?' por la tarde':'')+' tengo estos huecos. ¿Cuál te viene bien?',ops.map(function(x){return x.h}));return}
      S.chatEstado={paso:'srv'};bot('Mañana'+(tarde?' por la tarde':'')+' no me queda hueco. Te busco otro día: ¿qué necesitas?',CFG.servicios.map(function(s){return s.n}));return}
    S.chatEstado={paso:'srv'};bot('¡Vamos! ¿Qué necesitas?',CFG.servicios.map(function(s){return s.n}));return}
  bot('Eso no lo sé seguro y no quiero inventármelo. Ya se lo he pasado a la clínica; también puedes escribirles al '+CFG.tel+'.',QUICK());regPreg(txt,'Pasada a vuestro WhatsApp','wa');
}

/* ---------- eventos ---------- */
function irWa(){S.hoja=null;S.movTab=3;render();var t=$('.tres>div:nth-child(3) .mov');if(t&&innerWidth>1080){t.classList.add('brilla');setTimeout(function(){t.classList.remove('brilla')},1600)}}
document.addEventListener('click',function(ev){
  if(ev.target.classList&&ev.target.classList.contains('hoja')){S.hoja=null;render();return}
  var a0=ev.target.closest('a');if(a0)return;
  var b=ev.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='v-clin'||b.id==='v-clin2'){S.modo='clin';S.hoja=null;render();window.scrollTo(0,0);return}
  if(b.id==='v-pac'){S.modo='pac';render();window.scrollTo(0,0);return}
  if(b.dataset.tour){tour(b.dataset.tour);return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.sel=null;S.nuevoHueco=null;S.modo='clin';render();window.scrollTo(0,0);return}
  if(b.dataset.dia){S.agDia=b.dataset.dia;S.sel=null;S.nuevoHueco=null;render();return}
  if(b.dataset.filtro){S.filtroPac=b.dataset.filtro;render();return}
  if(b.dataset.mov){S.movTab=+b.dataset.mov;render();return}
  if(b.dataset.srv&&S.rv){S.rv.srv=b.dataset.srv;S.rv.paso=2;render();return}
  if(b.dataset.rpro!==undefined&&S.rv){S.rv.pro=b.dataset.rpro||null;render();return}
  if(b.dataset.rdia&&S.rv){S.rv.dia=b.dataset.rdia;render();return}
  if(b.dataset.rh&&S.rv){S.rv.h=b.dataset.rh;S.rv.hp=b.dataset.rhp;S.rv.paso=3;render();return}
  if(b.dataset.q){chatIn(b.dataset.q);render();return}
  var a=b.dataset.act,id=b.dataset.id,c=id&&S.citas.find(function(z){return z.id===id});
  switch(a){
    case 'atendida':c.est='hecha';var p=P(c.pac);if(p.bono&&p.bono.usadas<p.bono.total)p.bono.usadas++;pedirResena(c);log(p.n+' atendida · petición de reseña enviada','ok');toast('Atendida. Le ha salido el WhatsApp para pedir la reseña');break;
    case 'novino':c.est='novino';var p2=P(c.pac);wa(p2,'Hola '+nombre1(p2)+', hoy te esperábamos a las '+c.h+'. ¿Te buscamos otra hora? Contesta a este mensaje.','ausencia');log(p2.n+' no ha venido · WhatsApp para darle otra hora','bad');break;
    case 'pedir-resena':pedirResena(c);log('Petición de reseña enviada a '+P(c.pac).n,'acc');toast('Petición de reseña enviada');break;
    case 'ver':S.sel=id;S.nuevoHueco=null;break;
    case 'cerrar':S.sel=null;S.nuevoHueco=null;break;
    case 'confirmar':c.est='confirmada';if(c.rec)c.rec='confirmada';log(P(c.pac).n+' confirmada a mano','ok');break;
    case 'anular':anular(c,'desde la agenda');S.sel=null;toast('Anulada. El hueco se ha ofrecido a la lista de espera');break;
    case 'hueco':S.nuevoHueco={f:b.dataset.f,h:b.dataset.h,pro:b.dataset.pro};S.sel=null;break;
    case 'guardar-hueco':var n=S.nuevoHueco,pp=P($('#nh-pac').value);crearCita(pp,$('#nh-srv').value,n.pro,n.f,n.h,'Recepción');log('Cita añadida: '+pp.n+', '+n.h+' · confirmación enviada','ok');S.nuevoHueco=null;toast('Guardada y confirmación enviada por WhatsApp');break;
    case 'enviar-recs':var k=enviarRecs();toast(k+' recordatorios enviados por WhatsApp');break;
    case 'r1':c.rec='confirmada';c.est='confirmada';wa(P(c.pac),'1','recordatorio','in');log(P(c.pac).n+' confirma su cita de mañana','ok');break;
    case 'r2':c.rec='anulada';wa(P(c.pac),'2','recordatorio','in');anular(c,'contestó 2 al recordatorio');toast('Anulada por WhatsApp. El hueco ya se ha ofrecido a la lista de espera');break;
    case 'oferta-si':aceptarOferta(S.ofertas.find(function(o){return o.id===id}));break;
    case 'vuelta':var ina=S.pac.filter(function(p){var cs=S.citas.filter(function(z){return z.pac===p.id});var ult=cs.filter(function(z){return z.est==='hecha'}).map(function(z){return z.f}).sort().pop();var prox=cs.some(function(z){return z.f>=iso(HOY)&&(z.est==='confirmada'||z.est==='pendiente')});return ult&&!prox&&(HOY-deIso(ult))/864e5>=30});
      ina.forEach(function(p){wa(p,'Hola '+nombre1(p)+', hace tiempo que no te vemos por '+CFG.nombre+'. ¿Qué tal estás? Si quieres retomar las sesiones, contesta y te buscamos hueco.','vuelta')});log(ina.length+' pacientes que no venían, avisados por WhatsApp','acc');toast(ina.length+' mensajes enviados');break;
    case 'publicar':var r=S.resenas.find(function(z){return z.id===id});r._pub=++SEQ;r.resp=$('#rp-'+id).value.trim();r.okWa=false;log('Respuesta publicada a la reseña de '+r.a,'ok');toast('Respuesta publicada en Google');break;
    case 'publicar-todas':var l=S.resenas.filter(function(z){return !z.resp&&z.s>=4});l.forEach(function(z){z._pub=++SEQ;var ta=$('#rp-'+z.id);z.resp=ta?ta.value.trim():respuesta(z)});log(l.length+' respuestas publicadas','ok');toast('Así quedarían en vuestra ficha de Google');break;
    case 'auto-res':S.autoRes=!S.autoRes;toast(S.autoRes?'Las de 4 y 5 estrellas se contestarán solas':'Todas las respuestas esperarán tu OK');break;
    case 'otra':var r2=S.resenas.find(function(z){return z.id===id});r2.v=(r2.v||0)+1;r2.borr=respuesta(r2,r2.v);break;
    case 'pedir-todas':var pend=S.citas.filter(function(z){return z.est==='hecha'&&!z.resena&&z.f>=iso(addD(HOY,-3))});pend.forEach(pedirResena);log(pend.length+' peticiones de reseña enviadas por WhatsApp','acc');toast(pend.length+' peticiones enviadas');break;
    case 'aplicar':aplicar();toast('Cambios guardados');break;
    case 'guardar-faq':var dv=$('#cf-doc');if(dv&&/^https?:\/\/\S+$/.test(dv.value.trim())&&dv.value.indexOf('…')<0)CFG.doctoralia=dv.value.trim();toast('Guardado. El asistente ya lo sabe');return;
    case 'copiar':var u=$('#url-demo').textContent;if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('Enlace copiado')},function(){toast('Selecciona el enlace y cópialo')});else toast('Selecciona el enlace y cópialo');return;
    case 'g-reservar':if(LIG){S.hoja={m:1,tipo:'doc'};S.clicsRes++;log('Alguien ha pulsado «Reservar» en Google → '+CFG.sistema,'acc')}else abrirReserva(1);break;
    case 'w-cita':if(LIG){S.hoja={m:2,tipo:'doc'};S.clicsRes++}else abrirReserva(2);break;
    case 'w-chat':S.hoja={m:2,tipo:'chat'};break;
    case 'g-otro':toast('En la ficha real, esto abre el mapa o la llamada');return;
    case 'g-escribir':case 'q-google':toast('Aquí se abre la ventana para escribir la reseña en Google');return;
    case 'd-ir':toast(CFG.doctoralia?'Aquí se abre vuestra agenda de '+CFG.sistema:'Aquí se abre vuestra agenda de '+CFG.sistema+' (el enlace se pone en Asistente)');return;
    case 'cerrar-hoja':S.hoja=null;break;
    case 'rv-atras':S.rv.paso=Math.max(1,S.rv.paso-1);break;
    case 'reservar':reservar();return;
    case 'ver-wa':irWa();return;
    default:return;
  }
  render();
});
document.addEventListener('submit',function(ev){if(ev.target.id==='chat-f'){ev.preventDefault();var i=$('#chat-in');var v=i.value.trim().slice(0,200);if(v){chatIn(v);render();var j=$('#chat-in');if(j)j.focus()}}});
function reservar(){
  var rv=S.rv,ni=$('#r-n'),ti=$('#r-t');rv.nom=ni.value;rv.tel=ti.value;
  var nom=rv.nom.trim(),tel=rv.tel.replace(/\D/g,'');
  if(nom.length<3){toast('Escribe tu nombre');ni.focus();return}
  if(tel.length<9){toast('Escribe un móvil de 9 cifras');ti.focus();return}
  var l=libres(deIso(rv.dia),rv.pro).find(function(x){return x.h===rv.h});if(!l){toast('Esa hora se acaba de ocupar. Elige otra');rv.paso=2;render();return}
  var orig=rv.m===1?'Google':'Web';
  var p={id:nid('p'),n:nom.slice(0,40),tel:tel.slice(-9).replace(/(\d{3})(\d{2})(\d{2})(\d{2})/,'$1 $2 $3 $4'),alta:iso(HOY),origen:orig,pro:l.pro,bono:null};S.pac.push(p);
  var c=crearCita(p,rv.srv,l.pro,rv.dia,rv.h,orig);S.demoPac=p.id;
  log('Nueva cita desde '+(orig==='Google'?'Google':'la web')+': '+p.n+', '+fD(deIso(rv.dia))+' a las '+rv.h,'ok');
  rv.hecho=c.id;render();toast('Reservada. Nadie ha tenido que coger el teléfono');
}
function aplicar(){
  var v=function(id){var e=$('#'+id);return e?e.value.trim():''};
  CFG.nombre=v('cf-n').slice(0,50)||CFG.nombre;CFG.ciudad=v('cf-c').slice(0,40)||CFG.ciudad;CFG.direccion=v('cf-d').slice(0,90)||CFG.direccion;CFG.tel=v('cf-t').slice(0,20)||CFG.tel;
  CFG.servicios.forEach(function(s){var n=+v('sv-'+s.id);if(n>0)s.precio=Math.round(n)});
  CFG.pros.forEach(function(p){var n=v('pr-'+p.id);if(n)p.n=n.slice(0,20)});var r=v('cf-rec');if(r)CFG.plantillaRec=r.slice(0,400);
}

/* ---------- recorrido guiado ---------- */
function tour(k){
  if(k==='anula'){
    S.modo='clin';S.tab='recordatorios';
    if(S.citas.some(function(c){return c.f===iso(MANANA)&&c.rec==='por enviar'}))enviarRecs();
    var cand=S.citas.filter(function(c){return c.f===iso(MANANA)&&c.rec==='enviado'})[0]||S.citas.filter(function(c){return c.f===iso(MANANA)&&c.est!=='anulada'&&c.pac!==S.demoPac})[0];
    if(cand){cand.rec='anulada';wa(P(cand.pac),'2','recordatorio','in');anular(cand,'contestó 2 al recordatorio');toast(nombre1(P(cand.pac))+' no puede venir: el hueco ya se ha ofrecido a la lista de espera')}
  }
  if(k==='reserva'){S.modo='pac';if(LIG){S.hoja={m:1,tipo:'doc'};S.movTab=1;S.clicsRes++;toast('Pulsa «Reservar» en Google y acaba en vuestro '+CFG.sistema)}else{abrirReserva(1,'val');toast('Elige día y hora: en cuatro toques está reservada')}}
  if(k==='resena'){nuevaRes('Lucía Torres',5,'Vine por una contractura en el cuello que llevaba semanas arrastrando y salí nueva. '+CFG.pros[0].n+' me explicó qué ejercicios hacer en casa. Muy recomendable.');S.modo='clin';S.tab='resenas';toast(S.autoRes?'Reseña de 5 estrellas: contestada sola en 2 minutos':'Reseña nueva: la respuesta ya está escrita, falta tu OK')}
  if(k==='resena-mala'){nuevaRes('Roberto Sanz',2,'Me cambiaron la cita dos veces y el último día esperé más de 20 minutos. El tratamiento bien, pero la organización mejorable.');S.modo='clin';S.tab='resenas';toast('Reseña de 2 estrellas: te ha llegado por WhatsApp con la respuesta escrita')}
  if(k==='noche'){S.modo='pac';S.movTab=2;S.hoja={m:2,tipo:'chat'};NOW=23*60+40;
    if(!S.chat.length)S.chat.push({yo:false,t:'¡Hola! Soy el asistente de '+CFG.nombre+'. Te contesto al momento, a cualquier hora. ¿En qué te ayudo?'});
    if(LIG){chatIn('¿Tenéis hueco mañana por la tarde?')}
    else{var dT=MANANA,ops=[];for(var g=0;g<10;g++){ops=libres(dT).filter(function(x){return toMin(x.h)>=15*60}).slice(0,6);if(ops.length)break;dT=sigLab(dT)}
      if(!ops.length){dT=MANANA;ops=libres(dT).slice(0,6)}
      var esMan=iso(dT)===iso(MANANA);
      S.chat.push({yo:true,t:esMan?'¿Tenéis hueco mañana por la tarde?':'¿Tenéis hueco el '+DIAS[dT.getDay()]+' por la tarde?'});
      S.chatEstado={paso:'hora',srv:'fis',dia:iso(dT)};
      bot('¡Sí! El '+fD(dT)+' tengo estos huecos. ¿Cuál te viene bien?',ops.map(function(x){return x.h}));
      regPreg('¿Hueco mañana por la tarde?','Le ofrece '+ops.length+' horas','cita')}
    S.preg[0].h='23:40';
    log('El asistente ha contestado a las 23:40, con la clínica cerrada','acc');
    toast('Son las 23:40, la clínica está cerrada y ya tiene respuesta');
    render();NOW=NOW0;alPrincipio();return}
  render();alPrincipio();
}
function alPrincipio(){var m=S.modo==='pac'&&innerWidth<=1080&&$('.movtabs');if(m)window.scrollTo(0,m.getBoundingClientRect().top+scrollY-12);else window.scrollTo(0,0)}

log('Recepción automática activada','info');
if(!LIG){enviarRecs()}
else{log('Ficha de Google revisada: horario y botón «Reservar» al día','ok');log('Pregunta de anoche (23:12) pasada a tu WhatsApp','acc')}
render();
})();

</script>
