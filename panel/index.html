<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel de citas</title>
<style>
:root{--bg:#F3F5F4;--card:#fff;--ink:#16211F;--muted:#5D6A67;--line:#DCE3E0;--line2:#ECF0EE;--ac:#0D6B5F;--soft:#E5F0EC;
  --pend:#B7791F;--pend-bg:#FFF6E5;--ok:#1E7A4C;--ok-bg:#E6F4EC;--hecha:#6B7672;--hecha-bg:#EEF1F0;--no:#B23B2A;--no-bg:#FBE9E5;--fuera:#EEF1F0;
  --f:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;--h:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
/* Acceso */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
.login h1{margin:0;font-size:1.35rem}
.login p{margin:0;color:var(--muted);font-size:.92rem}
label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--card);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:none}
.btn{border:0;background:var(--ac);color:#fff;font-weight:700;border-radius:10px;padding:11px 16px;min-height:44px}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.peligro{background:var(--card);color:var(--no);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:progress}
.error{background:var(--no-bg);color:var(--no);border-radius:10px;padding:9px 12px;font-size:.9rem;margin:0}
/* App */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.marca{font-weight:700;font-size:1.02rem;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tabs{display:flex;gap:2px;background:var(--line2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icono{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 10px;font-weight:600}
main{min-height:0;overflow:auto}
.nav-dia{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px}
.nav-dia h2{margin:0 auto 0 4px;font-size:1.1rem;text-transform:capitalize}
.nav-dia input[type=date]{width:auto}
.resumen-dia{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
.pill{font-size:.82rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--card);border:1px solid var(--line)}
.pill b{font-variant-numeric:tabular-nums}
.agenda-wrap{padding:0 16px 24px}
.agenda{display:grid;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 190px)}
.col-h{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:9px 10px;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.col-h i{width:10px;height:10px;border-radius:50%;flex:none}
.col-h.horas{left:0;z-index:6}
.horas-col{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--line)}
.horas-col span{position:absolute;right:8px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.col{position:relative;border-right:1px solid var(--line2);min-width:180px}
.col:last-child{border-right:0}
.franja{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.franja.hora{border-top-color:var(--line)}
.fuera{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--fuera) 0 6px,transparent 6px 12px);pointer-events:none}
.ahora{position:absolute;left:0;right:0;border-top:2px solid var(--no);z-index:3;pointer-events:none}
.hueco{position:absolute;left:0;right:0;border:0;background:transparent;padding:0}
.hueco:hover{background:var(--soft)}
.cita{position:absolute;left:4px;right:4px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--c,var(--ac));background:var(--card);padding:3px 7px;text-align:left;overflow:hidden;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:.82rem;line-height:1.25}
.cita b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cita.pendiente{background:var(--pend-bg)}
.cita.hecha{background:var(--hecha-bg);opacity:.85}
.cita.no_vino{background:var(--no-bg)}
.cita.anulada{background:transparent;border-style:dashed;opacity:.6;text-decoration:line-through}
.est{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.est.pendiente{background:var(--pend-bg);color:var(--pend)}.est.confirmada{background:var(--ok-bg);color:var(--ok)}
.est.hecha{background:var(--hecha-bg);color:var(--hecha)}.est.no_vino,.est.anulada{background:var(--no-bg);color:var(--no)}
/* Pacientes */
.pac{padding:12px 16px 24px;display:grid;gap:12px;max-width:820px}
.lista{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.fila:last-child{border-bottom:0}
.fila .n{font-weight:600}.fila .t{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.vacio{color:var(--muted);padding:18px;text-align:center;margin:0}
/* Ventana */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 70px -20px rgba(0,0,0,.4);color:var(--ink)}
dialog::backdrop{background:rgba(15,25,22,.45)}
.dlg{display:grid;gap:14px;padding:20px}
.dlg h3{margin:0;font-size:1.15rem}
.dlg .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .estados{display:flex;gap:6px;flex-wrap:wrap}
.dlg .estados button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}
.dlg .estados button[aria-pressed="true"]{border-color:var(--ac);background:var(--soft);color:var(--ac)}
.dato{display:grid;gap:1px}.dato small{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.dlg a{color:var(--ac);font-weight:600;text-underline-offset:3px}
.copiar{border:0;background:none;color:var(--ac);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.sugs{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:200px;overflow-y:auto}
.sugs button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line2);background:var(--card);padding:9px 11px;text-align:left}
.sugs button:last-child{border-bottom:0}
.sugs button:hover,.sugs button:focus{background:var(--soft)}
.elegido{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:9px 12px}
.aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:600;max-width:calc(100vw - 32px)}
@media (max-width:640px){
  header.barra{padding:8px 12px}.nav-dia,.resumen-dia,.agenda-wrap{padding-left:12px;padding-right:12px}
  .col{min-width:150px}.agenda{max-height:calc(100vh - 230px)}
  .dlg .fila2{grid-template-columns:1fr}
}


.r-cab{display:flex;gap:8px;flex-wrap:wrap}
.r-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.r-card h3{margin:0;font-size:1.02rem}
.r-card p{margin:0;color:var(--muted);font-size:.92rem}
.r-fila{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.r-fila:last-child{border-bottom:0}
.r-fila .n{font-weight:600}
.r-fila .s{color:var(--muted);font-size:.86rem;grid-column:1}
.r-fila .msg{grid-column:1 / -1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.9rem;line-height:1.45;white-space:pre-wrap}
.r-enviar{grid-row:1 / span 2;grid-column:2;display:inline-flex;align-items:center;gap:7px;border:0;background:#1FA855;color:#fff;font-weight:700;border-radius:999px;padding:10px 16px;text-decoration:none;min-height:44px;white-space:nowrap}
.r-enviar svg{width:18px;height:18px}
.r-hecha{color:var(--ok);font-weight:700;font-size:.85rem;grid-row:1 / span 2;grid-column:2}
.r-tit{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:6px 2px 0}
/* ---------- Móvil ---------- */
input,select,textarea{font-size:16px}
.m-cab,.m-lista,.m-nav{display:none}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
@media (max-width:720px){
  html,body{height:auto}
  body{background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .app{display:block;height:auto}
  main{overflow:visible}
  header.barra{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;gap:8px;flex-wrap:nowrap}
  header.barra .tabs,#b-nueva{display:none}
  header.barra.multi .marca{display:none}
  header.barra.multi #sel-clinica{flex:1;max-width:none!important;font-weight:700}
  .marca{font-size:1.05rem}
  #b-salir{height:36px;min-width:0;padding:0 12px;font-size:.85rem;border-radius:999px}
  .nav-dia,.agenda-wrap{display:none}
  .resumen-dia{padding:2px 16px 10px;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .resumen-dia::-webkit-scrollbar{display:none}
  .pill{white-space:nowrap}
  .m-cab{display:grid;gap:10px;padding:12px 0 8px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:15}
  .m-mes{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .m-mes b{font-size:1.15rem}
  .m-mes button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem}
  .m-dias{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
  .m-dias::-webkit-scrollbar{display:none}
  .m-dia{flex:none;width:48px;border:0;background:transparent;border-radius:14px;padding:7px 0;display:grid;justify-items:center;gap:2px;scroll-snap-align:center}
  .m-dia span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .m-dia b{font-size:1.1rem;line-height:1.2;font-variant-numeric:tabular-nums}
  .m-dia i{width:5px;height:5px;border-radius:50%;background:transparent}
  .m-dia.con i{background:var(--ac)}
  .m-dia.hoy b{color:var(--ac)}
  .m-dia[aria-pressed="true"]{background:var(--ac)}
  .m-dia[aria-pressed="true"] span,.m-dia[aria-pressed="true"] b{color:#fff}
  .m-dia[aria-pressed="true"] i{background:#fff}
  .m-pros{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  .m-pros::-webkit-scrollbar{display:none}
  .m-pros button{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
  .m-pros button i{width:9px;height:9px;border-radius:50%}
  .m-pros button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .m-lista{display:grid;gap:8px;padding:12px 16px 20px}
  .m-cita,.m-hueco{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border-radius:16px;padding:12px 14px}
  .m-cita{background:var(--card);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--c,var(--ac)),0 1px 2px rgba(0,0,0,.04);animation:sube .25s ease both}
  .m-cita.pasada{opacity:.6}
  .m-cita.anulada .m-t b{text-decoration:line-through}
  .m-h{display:grid;gap:0;font-variant-numeric:tabular-nums}
  .m-h b{font-size:1.02rem}
  .m-h small{color:var(--muted);font-size:.8rem}
  .m-t{min-width:0;display:grid;gap:1px}
  .m-t b{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-t small{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-hueco{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
  .m-hueco .m-mas{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-size:1.25rem;font-weight:700;line-height:1}
  .m-ahora{display:flex;align-items:center;gap:8px;color:var(--no);font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:2px 0}
  .m-ahora::after{content:"";flex:1;border-top:2px solid var(--no)}
  .m-vacio{text-align:center;color:var(--muted);padding:40px 16px;display:grid;gap:6px}
  .m-vacio b{color:var(--ink);font-size:1.05rem}
  .m-nav{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
  .m-nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);padding:6px 0}
  .m-nav button svg{width:24px;height:24px}
  .m-nav button[aria-pressed="true"]{color:var(--ac)}
  .m-nav .m-fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;margin:0;border-radius:50%;background:var(--ac);color:#fff;font-size:1.8rem;font-weight:400;place-items:center;box-shadow:0 10px 24px -8px rgba(13,107,95,.6)}
  .pac{padding:12px 16px 24px}
  .pac input[type=search]{border-radius:14px;padding:12px 14px}
  .lista{border-radius:16px}
  .fila{padding:14px 16px;min-height:56px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh;animation:sube .25s ease}
  .dlg{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .dlg::before{content:"";justify-self:center;width:40px;height:5px;border-radius:5px;background:var(--line);margin-bottom:4px}
  .dlg .acciones{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
  .dlg .acciones .btn{flex:1;min-height:50px;border-radius:14px;font-size:1rem}
  .dlg .estados button{padding:9px 14px;font-size:.92rem}
  .aviso{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .login form{border:0;background:transparent;padding:8px}
  .login h1{font-size:1.6rem}
  .login .btn{min-height:52px;border-radius:14px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.m-cita,dialog{animation:none}}
</style>
</head>
<body>

<section class="login" id="v-login" hidden>
  <form id="f-login" novalidate>
    <h1>Panel de citas</h1>
    <p>Entra con el email y la contraseña de tu clínica.</p>
    <label for="l-email">Email<input id="l-email" type="email" autocomplete="username" required></label>
    <label for="l-pass">Contraseña<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <p class="error" id="l-err" hidden></p>
    <button class="btn" id="l-btn" type="submit">Entrar</button>
  </form>
</section>

<div class="app" id="v-app" hidden>
  <header class="barra">
    <div class="marca" id="marca">Panel<small id="marca-sub"></small></div>
    <select id="sel-clinica" aria-label="Clínica" hidden style="width:auto;max-width:44vw"></select>
    <div class="tabs" role="group" aria-label="Vista">
      <button type="button" id="t-agenda" aria-pressed="true">Agenda</button>
      <button type="button" id="t-pac" aria-pressed="false">Pacientes</button>
      <button type="button" id="t-res" aria-pressed="false">Reseñas</button>
    </div>
    <button class="icono" type="button" id="b-nueva" title="Nueva cita">+ Cita</button>
    <button class="icono" type="button" id="b-salir" title="Salir">Salir</button>
  </header>
  <main>
    <section id="v-agenda">
      <div class="m-cab">
        <div class="m-mes"><b id="m-mes"></b><button type="button" id="m-hoy">Hoy</button></div>
        <div class="m-dias" id="m-dias" role="group" aria-label="Días"></div>
        <div class="m-pros" id="m-pros" role="group" aria-label="Profesional"></div>
      </div>
      <div class="nav-dia">
        <button class="icono" type="button" id="d-ant" aria-label="Día anterior">‹</button>
        <button class="icono" type="button" id="d-hoy">Hoy</button>
        <button class="icono" type="button" id="d-sig" aria-label="Día siguiente">›</button>
        <h2 id="d-titulo"></h2>
        <input type="date" id="d-fecha" aria-label="Ir a fecha">
        <label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:.85rem"><input type="checkbox" id="d-anuladas"> Ver anuladas</label>
      </div>
      <div class="resumen-dia" id="resumen"></div>
      <div class="agenda-wrap"><div class="agenda" id="agenda"></div></div>
      <div class="m-lista" id="m-lista"></div>
    </section>
    <section id="v-res" hidden>
      <div class="pac" id="res"></div>
    </section>
    <section id="v-pac" hidden>
      <div class="pac">
        <input type="search" id="p-buscar" placeholder="Buscar por nombre o teléfono" aria-label="Buscar paciente">
        <div class="lista" id="p-lista"></div>
      </div>
    </section>
  </main>
  <nav class="m-nav" aria-label="Secciones">
    <button type="button" id="mn-agenda" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
    <button type="button" id="mn-res" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>Reseñas</button>
    <button type="button" class="m-fab" id="m-fab" aria-label="Nueva cita">+</button>
    <button type="button" id="mn-pac" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Pacientes</button>
  </nav>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-in"></div></dialog>
<div class="aviso" id="aviso" role="status" hidden></div>

<script src="../reservar/config.js"></script>
<script>
(function(){
'use strict';
var CFG = window.CITAS_CFG, $ = function(i){ return document.getElementById(i) };
var S = null;           // sesión
var MIS = [];           // clínicas del usuario
var Y = {};             // yo: clinica, rol, profesional_id
var D = {pros:[], servs:[], sp:[], horarios:[], citas:[]};
var dia = null;         // 'YYYY-MM-DD' en la zona de la clínica
var H0 = 8, H1 = 21, PX = 72; // horas visibles y píxeles por hora
var EST = {pendiente:'Pendiente', confirmada:'Confirmada', hecha:'Hecha', no_vino:'No vino', anulada:'Anulada'};

// ---------- Sesión ----------
function guardar(s){ S = s; try{ s ? localStorage.setItem('panel-s', JSON.stringify(s)) : localStorage.removeItem('panel-s') }catch(e){} }
function cargarSesion(){ try{ return JSON.parse(localStorage.getItem('panel-s') || 'null') }catch(e){ return null } }
function auth(tipo, cuerpo){
  return fetch(CFG.url + '/auth/v1/token?grant_type=' + tipo, {method:'POST', headers:{apikey:CFG.key,'Content-Type':'application/json'}, body:JSON.stringify(cuerpo)})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description || j.msg || j.error || 'ERROR'); return j }) })
    .then(function(j){ guardar({t:j.access_token, r:j.refresh_token, exp:Date.now() + j.expires_in*1000, uid:j.user.id, email:j.user.email}); return S });
}
function token(){
  if(!S) return Promise.reject(new Error('SIN_SESION'));
  if(Date.now() < S.exp - 60000) return Promise.resolve(S.t);
  return auth('refresh_token', {refresh_token:S.r}).then(function(s){ return s.t }).catch(function(e){ salir(); throw e });
}
function api(ruta, opc){
  opc = opc || {};
  return token().then(function(t){
    var h = {apikey:CFG.key, Authorization:'Bearer ' + t, 'Content-Type':'application/json'};
    if(opc.devolver) h.Prefer = 'return=representation';
    return fetch(CFG.url + '/rest/v1/' + ruta, {method:opc.metodo || 'GET', headers:h, body:opc.cuerpo ? JSON.stringify(opc.cuerpo) : undefined});
  }).then(function(r){
    if(r.status === 401){ salir(); throw new Error('SIN_SESION') }
    if(r.status === 204) return null;
    return r.json().then(function(j){ if(!r.ok){ var e = new Error(j.message || 'ERROR'); e.code = j.code; throw e } return j });
  });
}
function salir(){ guardar(null); $('v-app').hidden = true; $('v-login').hidden = false; clearInterval(window.__poll) }

$('f-login').addEventListener('submit', function(ev){
  ev.preventDefault();
  var b = $('l-btn'), err = $('l-err'); err.hidden = true; b.disabled = true; b.textContent = 'Entrando…';
  auth('password', {email:$('l-email').value.trim(), password:$('l-pass').value})
    .then(arrancar)
    .catch(function(e){ err.textContent = /invalid/i.test(e.message) ? 'Email o contraseña incorrectos.' : 'No se ha podido entrar. Inténtalo de nuevo.'; err.hidden = false })
    .finally(function(){ b.disabled = false; b.textContent = 'Entrar' });
});
$('b-salir').onclick = function(){ salir() };

// ---------- Fechas en la zona de la clínica ----------
function tz(){ return (Y.clinica && Y.clinica.zona_horaria) || 'Europe/Madrid' }
function partes(d){ var o = {}; new Intl.DateTimeFormat('en-GB',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(p){ o[p.type] = p.value }); if(o.hour === '24') o.hour = '00'; return o }
function diaDe(d){ var p = partes(d); return p.year + '-' + p.month + '-' + p.day }
function horaDe(d){ var p = partes(d); return p.hour + ':' + p.minute }
function minutosDe(d){ var p = partes(d); return (+p.hour)*60 + (+p.minute) }
function aFecha(diaStr, hhmm){ // hora local de la clínica -> Date
  var a = diaStr.split('-').map(Number), h = hhmm.split(':').map(Number);
  var guess = Date.UTC(a[0], a[1]-1, a[2], h[0], h[1]);
  for(var i=0;i<2;i++){ var p = partes(new Date(guess)); var vista = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute); guess += Date.UTC(a[0], a[1]-1, a[2], h[0], h[1]) - vista }
  return new Date(guess);
}
function sumaDias(diaStr, n){ var d = new Date(diaStr + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10) }
function isoDow(diaStr){ var d = new Date(diaStr + 'T12:00:00Z').getUTCDay(); return d === 0 ? 7 : d }
function largo(diaStr){ return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(diaStr + 'T12:00:00Z')) }
function hm(min){ return String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0') }
function avisar(t){ var a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(a._t); a._t = setTimeout(function(){ a.hidden = true }, 2600) }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function gestion(){ return Y.rol === 'dueno' || Y.rol === 'recepcion' }

// ---------- Arranque ----------
function arrancar(){
  return api('usuarios_clinica?select=clinica_id,rol,profesional_id,clinicas(id,nombre,zona_horaria,slug,google_resena_url)&user_id=eq.' + S.uid).then(function(r){
    if(!r.length){ $('v-login').hidden = false; $('l-err').textContent = 'Tu usuario aún no está enlazado a ninguna clínica. Avisa a Guillem.'; $('l-err').hidden = false; guardar(null); return }
    var elegida = null; try{ elegida = localStorage.getItem('panel-clinica') }catch(e){}
    var u = r.find(function(x){ return x.clinica_id === elegida }) || r[0]; Y = {clinica:u.clinicas, rol:u.rol, profesional_id:u.profesional_id};
    MIS = r;
    $('marca').firstChild.nodeValue = u.clinicas.nombre;
    var sc = $('sel-clinica'); sc.hidden = r.length < 2; document.querySelector('header.barra').classList.toggle('multi', r.length > 1);
    sc.innerHTML = r.map(function(x){ return '<option value="' + x.clinica_id + '"' + (x === u ? ' selected' : '') + '>' + esc(x.clinicas.nombre) + '</option>' }).join('');
    $('marca-sub').textContent = ({dueno:'Dueño', recepcion:'Recepción', profesional:'Profesional'})[u.rol] + ' · ' + S.email;
    $('b-nueva').hidden = !gestion(); $('m-fab').hidden = !gestion(); $('t-res').hidden = !gestion(); $('mn-res').hidden = !gestion();
    var c = 'clinica_id=eq.' + u.clinica_id;
    return Promise.all([
      api('profesionales?select=id,nombre,color,activo,orden&order=orden,nombre&' + c),
      api('servicios?select=id,nombre,duracion_min,precio,activo&order=orden,nombre&' + c),
      api('servicio_profesional?select=servicio_id,profesional_id&' + c),
      api('horarios?select=profesional_id,dia_semana,inicio,fin&' + c)
    ]).then(function(x){
      D.pros = x[0]; D.servs = x[1]; D.sp = x[2]; D.horarios = x[3];
      var ini = 24*60, fin = 0;
      D.horarios.forEach(function(h){ var a = h.inicio.slice(0,5).split(':'), b = h.fin.slice(0,5).split(':'); ini = Math.min(ini, +a[0]*60 + +a[1]); fin = Math.max(fin, +b[0]*60 + +b[1]) });
      if(fin > ini){ H0 = Math.max(0, Math.floor(ini/60) - (ini % 60 ? 0 : 0)); H1 = Math.min(24, Math.ceil(fin/60)) }
      $('v-login').hidden = true; $('v-app').hidden = false;
      dia = dia || diaDe(new Date());
      pintarDia();
      clearInterval(window.__poll); window.__poll = setInterval(function(){ if(!document.hidden && !$('dlg').open) cargarDia(true) }, 60000);
    });
  }).catch(function(e){ if(e.message !== 'SIN_SESION'){ avisar('No se ha podido cargar el panel'); console.error(e) } });
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S && dia && !$('dlg').open) cargarDia(true) });

// ---------- Agenda del día ----------
function prosVisibles(){ return D.pros.filter(function(p){ return p.activo && (Y.rol !== 'profesional' || p.id === Y.profesional_id) }) }
function cargarDia(silencio){
  var desde = aFecha(dia, '00:00').toISOString(), hasta = aFecha(sumaDias(dia,1), '00:00').toISOString();
  return api('citas?select=id,inicio,fin,estado,origen,nota,profesional_id,servicio_id,paciente_id,pacientes(nombre,telefono)&clinica_id=eq.' + Y.clinica.id +
             '&inicio=gte.' + encodeURIComponent(desde) + '&inicio=lt.' + encodeURIComponent(hasta) + '&order=inicio')
    .then(function(c){ D.citas = c; dibujar() })
    .catch(function(e){ if(!silencio) avisar('No se han podido cargar las citas'); console.error(e) });
}
function pintarDia(){ $('d-titulo').textContent = largo(dia); $('d-fecha').value = dia; cargarDia(); if(movil.matches) cargarPuntos() }
$('d-ant').onclick = function(){ dia = sumaDias(dia,-1); pintarDia() };
$('d-sig').onclick = function(){ dia = sumaDias(dia,1); pintarDia() };
$('d-hoy').onclick = function(){ dia = diaDe(new Date()); pintarDia() };
$('d-fecha').onchange = function(){ if(this.value){ dia = this.value; pintarDia() } };
$('d-anuladas').onchange = dibujar;

var movil = matchMedia('(max-width: 720px)'), proSel = 'todos';
if(movil.addEventListener) movil.addEventListener('change', function(){ if(D.citas) dibujar() });
function dibujar(){
  if(movil.matches){ resumenDia(); return dibujarMovil() }
  var pros = prosVisibles(), ag = $('agenda'), alto = (H1 - H0) * PX, verAn = $('d-anuladas').checked;
  ag.style.gridTemplateColumns = '56px repeat(' + Math.max(pros.length,1) + ', minmax(170px, 1fr))';
  var h = '<div class="col-h horas"></div>';
  pros.forEach(function(p){ h += '<div class="col-h"><i style="background:' + esc(p.color) + '"></i>' + esc(p.nombre) + '</div>' });
  h += '<div class="horas-col" style="height:' + alto + 'px;position:sticky">';
  for(var k = H0 + 1; k < H1; k++) h += '<span style="top:' + ((k - H0) * PX) + 'px">' + hm(k*60) + '</span>';
  h += '</div>';
  var dow = isoDow(dia), ahora = new Date(), hoy = diaDe(ahora) === dia;
  pros.forEach(function(p){
    h += '<div class="col" data-p="' + p.id + '" style="height:' + alto + 'px">';
    for(var m = H0*60; m < H1*60; m += 15) h += '<div class="franja' + (m % 60 === 0 ? ' hora' : '') + '" style="top:' + ((m - H0*60) / 60 * PX) + 'px"></div>';
    // Fuera de horario: sombreado
    var bloques = D.horarios.filter(function(x){ return x.profesional_id === p.id && x.dia_semana === dow })
      .map(function(x){ var a = x.inicio.split(':'), b = x.fin.split(':'); return [+a[0]*60 + +a[1], +b[0]*60 + +b[1]] }).sort(function(a,b){ return a[0]-b[0] });
    var cur = H0*60;
    bloques.concat([[H1*60, H1*60]]).forEach(function(b){ if(b[0] > cur) h += '<div class="fuera" style="top:' + ((cur - H0*60)/60*PX) + 'px;height:' + ((b[0]-cur)/60*PX) + 'px"></div>'; cur = Math.max(cur, b[1]) });
    if(gestion()) for(var q = H0*60; q < H1*60; q += 15) h += '<button class="hueco" type="button" tabindex="-1" aria-label="Nueva cita a las ' + hm(q) + ' con ' + esc(p.nombre) + '" data-h="' + hm(q) + '" style="top:' + ((q - H0*60)/60*PX) + 'px;height:' + (PX/4) + 'px"></button>';
    D.citas.filter(function(c){ return c.profesional_id === p.id && (verAn || c.estado !== 'anulada') }).forEach(function(c){
      var i = new Date(c.inicio), f = new Date(c.fin), mi = minutosDe(i), mf = minutosDe(f) || 24*60;
      var top = (mi - H0*60)/60*PX, hh = Math.max(22, (mf - mi)/60*PX - 2);
      var s = D.servs.find(function(x){ return x.id === c.servicio_id }) || {};
      h += '<button type="button" class="cita ' + c.estado + '" data-c="' + c.id + '" style="--c:' + esc(p.color) + ';top:' + top + 'px;height:' + hh + 'px">' +
           '<b>' + esc(horaDe(i)) + ' · ' + esc(c.pacientes ? c.pacientes.nombre : '') + '</b><span>' + esc(s.nombre || '') + ' · ' + EST[c.estado] + (c.origen !== 'recepcion' ? ' · ' + c.origen : '') + '</span></button>';
    });
    if(hoy){ var mn = minutosDe(ahora); if(mn >= H0*60 && mn <= H1*60) h += '<div class="ahora" style="top:' + ((mn - H0*60)/60*PX) + 'px"></div>' }
    h += '</div>';
  });
  if(!pros.length) h += '<p class="vacio">No hay profesionales activos.</p>';
  ag.innerHTML = h;
  resumenDia();
  if(!dibujar._hecho){ dibujar._hecho = 1; var obj = hoy ? Math.max(0, (minutosDe(ahora) - H0*60)/60*PX - 120) : 0; ag.scrollTop = obj }
}
function resumenDia(){
  var act = D.citas.filter(function(c){ return c.estado !== 'anulada' }), cnt = function(e){ return D.citas.filter(function(c){ return c.estado === e }).length };
  $('resumen').innerHTML = '<span class="pill"><b>' + act.length + '</b> citas</span><span class="pill"><b>' + cnt('pendiente') + '</b> sin confirmar</span><span class="pill"><b>' + cnt('anulada') + '</b> anuladas</span>' +
    '<span class="pill"><b>' + D.citas.filter(function(c){ return c.origen !== 'recepcion' && c.estado !== 'anulada' }).length + '</b> pedidas online</span>';
}

// ---------- Agenda en el móvil: tira de días, profesionales y lista ----------
var diasConCitas = {};
function dibujarMovil(){
  var pros = prosVisibles();
  if(Y.rol === 'profesional') proSel = Y.profesional_id;
  if(proSel !== 'todos' && !pros.some(function(p){ return p.id === proSel })) proSel = 'todos';
  // Mes y tira de días (3 semanas desde el lunes anterior)
  var mes = new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(dia + 'T12:00:00Z')); $('m-mes').textContent = mes.charAt(0).toUpperCase() + mes.slice(1);
  var lunes = sumaDias(dia, 1 - isoDow(dia)), ini = sumaDias(lunes, -7), hoy = diaDe(new Date()), h = '';
  for(var i = 0; i < 28; i++){
    var d = sumaDias(ini, i), dd = new Date(d + 'T12:00:00Z');
    h += '<button type="button" class="m-dia' + (d === hoy ? ' hoy' : '') + (diasConCitas[d] ? ' con' : '') + '" data-d="' + d + '" aria-pressed="' + (d === dia) + '" aria-label="' + esc(largo(d)) + '">' +
         '<span>' + new Intl.DateTimeFormat('es-ES',{weekday:'short',timeZone:'UTC'}).format(dd).replace('.','').slice(0,3) + '</span><b>' + dd.getUTCDate() + '</b><i></i></button>';
  }
  var md = $('m-dias'); md.innerHTML = h;
  var sel = md.querySelector('[aria-pressed="true"]'); if(sel) md.scrollLeft = sel.offsetLeft - md.clientWidth/2 + sel.clientWidth/2;
  // Profesionales
  $('m-pros').hidden = pros.length < 2 || Y.rol === 'profesional';
  $('m-pros').innerHTML = (pros.length > 1 ? '<button type="button" data-p="todos" aria-pressed="' + (proSel === 'todos') + '">Todos</button>' : '') +
    pros.map(function(p){ return '<button type="button" data-p="' + p.id + '" aria-pressed="' + (proSel === p.id) + '"><i style="background:' + esc(p.color) + '"></i>' + esc(p.nombre) + '</button>' }).join('');
  // Lista
  var verAn = $('d-anuladas').checked, ahora = new Date(), esHoy = dia === hoy, mAhora = minutosDe(ahora), items = [];
  D.citas.forEach(function(c){
    if(c.estado === 'anulada' && !verAn) return;
    if(proSel !== 'todos' && c.profesional_id !== proSel) return;
    if(!pros.some(function(p){ return p.id === c.profesional_id })) return;
    var i = new Date(c.inicio); items.push({t:minutosDe(i), tipo:'cita', c:c});
  });
  // Huecos libres (solo con un profesional elegido y si puedes dar citas)
  var unPro = proSel !== 'todos' ? proSel : (pros.length === 1 ? pros[0].id : null), trabaja = true;
  if(unPro){
    var dow = isoDow(dia), bloques = D.horarios.filter(function(x){ return x.profesional_id === unPro && x.dia_semana === dow })
      .map(function(x){ var a = x.inicio.split(':'), b = x.fin.split(':'); return [+a[0]*60 + +a[1], +b[0]*60 + +b[1]] }).sort(function(a,b){ return a[0]-b[0] });
    trabaja = bloques.length > 0;
    if(gestion()){
      var ocup = D.citas.filter(function(c){ return c.profesional_id === unPro && c.estado !== 'anulada' }).map(function(c){ return [minutosDe(new Date(c.inicio)), minutosDe(new Date(c.fin)) || 1440] }).sort(function(a,b){ return a[0]-b[0] });
      bloques.forEach(function(b){
        var cur = b[0];
        if(esHoy) cur = Math.max(cur, Math.ceil(mAhora/15)*15);
        ocup.concat([[b[1], b[1]]]).forEach(function(o){
          if(o[1] <= cur) return;
          var fin = Math.min(o[0], b[1]);
          if(fin - cur >= 15) items.push({t:cur, tipo:'hueco', a:cur, b:fin, p:unPro});
          cur = Math.max(cur, o[1]);
        });
      });
    }
  }
  items.sort(function(x, y){ return x.t - y.t || (x.tipo === 'hueco' ? 1 : -1) });
  var out = '', puesto = false;
  items.forEach(function(it){
    if(esHoy && !puesto && it.t > mAhora){ out += '<div class="m-ahora">Ahora · ' + hm(mAhora) + '</div>'; puesto = true }
    if(it.tipo === 'hueco'){
      out += '<button type="button" class="m-hueco" data-p="' + it.p + '" data-h="' + hm(it.a) + '"><span class="m-h"><b>' + hm(it.a) + '</b></span><span>Libre hasta las ' + hm(it.b) + '</span><span class="m-mas" aria-hidden="true">+</span></button>';
      return;
    }
    var c = it.c, p = D.pros.find(function(x){ return x.id === c.profesional_id }) || {}, s = D.servs.find(function(x){ return x.id === c.servicio_id }) || {};
    var fin = new Date(c.fin), pasada = fin < ahora;
    out += '<button type="button" class="m-cita ' + c.estado + (pasada ? ' pasada' : '') + '" data-c="' + c.id + '" style="--c:' + esc(p.color || '') + '">' +
      '<span class="m-h"><b>' + horaDe(new Date(c.inicio)) + '</b><small>' + horaDe(fin) + '</small></span>' +
      '<span class="m-t"><b>' + esc(c.pacientes ? c.pacientes.nombre : '') + '</b><small>' + esc(s.nombre || '') + (proSel === 'todos' ? ' · ' + esc(p.nombre || '') : '') + (c.origen !== 'recepcion' ? ' · online' : '') + '</small></span>' +
      '<span class="est ' + c.estado + '">' + EST[c.estado] + '</span></button>';
  });
  if(esHoy && !puesto && items.length) out += '<div class="m-ahora">Ahora · ' + hm(mAhora) + '</div>';
  if(!items.length){
    var quien = unPro ? (D.pros.find(function(x){ return x.id === unPro }) || {}).nombre : '';
    out = '<div class="m-vacio"><b>' + (unPro && !trabaja ? esc(quien) + ' no trabaja este día' : 'Sin citas este día') + '</b><span>' + (gestion() ? 'Pulsa + para dar una cita.' : '') + '</span></div>';
  }
  $('m-lista').innerHTML = out;
}
$('m-dias').addEventListener('click', function(ev){ var b = ev.target.closest('.m-dia'); if(b){ dia = b.dataset.d; pintarDia() } });
$('m-pros').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b){ proSel = b.dataset.p; dibujarMovil() } });
$('m-hoy').onclick = function(){ dia = diaDe(new Date()); pintarDia() };
$('m-lista').addEventListener('click', function(ev){
  var c = ev.target.closest('.m-cita'); if(c) return verCita(c.dataset.c);
  var h = ev.target.closest('.m-hueco'); if(h) return nuevaCita({profesional_id:h.dataset.p, hora:h.dataset.h, dia:dia});
});
$('m-fab').onclick = function(){ nuevaCita({dia:dia, profesional_id: proSel !== 'todos' ? proSel : null}) };
$('mn-agenda').onclick = function(){ vista('agenda') };
$('mn-pac').onclick = function(){ vista('pac') };
// Puntos de «hay citas» en la tira de días
function cargarPuntos(){
  var ini = sumaDias(sumaDias(dia, 1 - isoDow(dia)), -7), fin = sumaDias(ini, 28);
  api('citas?select=inicio,profesional_id&clinica_id=eq.' + Y.clinica.id + '&estado=neq.anulada&inicio=gte.' + encodeURIComponent(aFecha(ini,'00:00').toISOString()) + '&inicio=lt.' + encodeURIComponent(aFecha(fin,'00:00').toISOString()))
    .then(function(r){ diasConCitas = {}; r.forEach(function(c){ if(Y.rol !== 'profesional' || c.profesional_id === Y.profesional_id) diasConCitas[diaDe(new Date(c.inicio))] = 1 }); if(movil.matches) dibujarMovil() }).catch(function(){});
}
$('agenda').addEventListener('click', function(ev){
  var c = ev.target.closest('.cita'); if(c) return verCita(c.dataset.c);
  var hq = ev.target.closest('.hueco'); if(hq) return nuevaCita({profesional_id:hq.closest('.col').dataset.p, hora:hq.dataset.h, dia:dia});
});

// ---------- Ventana ----------
function abrir(html){ $('dlg-in').innerHTML = html; var d = $('dlg'); if(!d.open) d.showModal(); var f = d.querySelector('input,select,button'); if(f) f.focus() }
function cerrar(){ $('dlg').close() }
$('dlg').addEventListener('click', function(ev){ if(ev.target === this) cerrar() });

// ---------- Ver / cambiar una cita ----------
function verCita(id){
  var c = D.citas.find(function(x){ return x.id === id }); if(!c) return;
  var p = D.pros.find(function(x){ return x.id === c.profesional_id }) || {}, s = D.servs.find(function(x){ return x.id === c.servicio_id }) || {};
  var tel = c.pacientes ? c.pacientes.telefono : '', i = new Date(c.inicio);
  var estados = gestion() ? ['pendiente','confirmada','hecha','no_vino','anulada'] : ['hecha','no_vino'];
  abrir('<h3>' + esc(c.pacientes ? c.pacientes.nombre : 'Paciente') + '</h3>' +
    '<div class="fila2"><div class="dato"><small>Cuándo</small><b>' + esc(largo(diaDe(i))) + ', ' + horaDe(i) + '–' + horaDe(new Date(c.fin)) + '</b></div>' +
    '<div class="dato"><small>Servicio</small><b>' + esc(s.nombre || '') + ' · ' + esc(p.nombre || '') + '</b></div></div>' +
    '<div class="dato"><small>Teléfono</small><span><b>' + esc(tel) + '</b> · <button class="copiar" type="button" id="c-copiar">Copiar</button> · <a href="https://wa.me/' + esc(tel.replace(/\D/g,'')) + '" target="_blank" rel="noopener">WhatsApp</a></span></div>' +
    '<div class="dato"><small>Estado</small><div class="estados" id="c-est">' + estados.map(function(e){ return '<button type="button" data-e="' + e + '" aria-pressed="' + (c.estado === e) + '">' + EST[e] + '</button>' }).join('') + '</div></div>' +
    (gestion() ? '<details><summary style="cursor:pointer;font-weight:600">Mover la cita</summary><div class="fila2" style="margin-top:10px"><label for="m-dia">Día<input type="date" id="m-dia" value="' + diaDe(i) + '"></label><label for="m-hora">Hora<input type="time" id="m-hora" step="900" value="' + horaDe(i) + '"></label></div>' +
      '<label for="m-pro" style="margin-top:10px">Profesional<select id="m-pro">' + D.pros.filter(function(x){ return x.activo }).map(function(x){ return '<option value="' + x.id + '"' + (x.id === c.profesional_id ? ' selected' : '') + '>' + esc(x.nombre) + '</option>' }).join('') + '</select></label>' +
      '<button class="btn sec" type="button" id="m-ok" style="margin-top:10px;width:100%">Guardar el cambio</button></details>' +
      '<label for="c-nota">Nota interna <small style="font-weight:400;color:var(--muted)">(solo organización, nada médico)</small><input type="text" id="c-nota" maxlength="200" value="' + esc(c.nota || '') + '"></label>' : '') +
    '<p class="error" id="c-err" hidden></p>' +
    '<div class="acciones">' + (gestion() ? '<button class="btn sec" type="button" id="c-guardar">Guardar nota</button>' : '') + '<button class="btn" type="button" id="c-cerrar">Cerrar</button></div>');
  $('c-cerrar').onclick = cerrar;
  $('c-copiar').onclick = function(){ var b = this; (navigator.clipboard ? navigator.clipboard.writeText(tel) : Promise.reject()).then(function(){ b.textContent = 'Copiado' }).catch(function(){ b.textContent = tel }) };
  $('c-est').onclick = function(ev){ var b = ev.target.closest('button'); if(!b) return; cambiar(c, {estado:b.dataset.e}, 'Cita: ' + EST[b.dataset.e]) };
  if(gestion()){
    $('c-guardar').onclick = function(){ cambiar(c, {nota:$('c-nota').value.trim() || null}, 'Nota guardada') };
    $('m-ok').onclick = function(){ var d = $('m-dia').value, hh = $('m-hora').value; if(!d || !hh) return;
      cambiar(c, {inicio:aFecha(d, hh).toISOString(), profesional_id:$('m-pro').value}, 'Cita movida', function(){ if(d !== dia){ dia = d; pintarDia() } }) };
  }
}
function cambiar(c, campos, ok, despues){
  api('citas?id=eq.' + c.id, {metodo:'PATCH', cuerpo:campos, devolver:true}).then(function(r){
    if(!r || !r.length) throw new Error('SIN_PERMISO');
    cerrar(); avisar(ok); cargarDia(); if(despues) despues();
  }).catch(function(e){ var x = $('c-err'); if(x){ x.textContent = errTexto(e); x.hidden = false } });
}
function errTexto(e){
  if(e.code === '23P01') return 'Ese profesional ya tiene otra cita a esa hora. Elige otra.';
  if(e.code === '23514' && /telefono/.test(e.message)) return 'El teléfono no es válido.';
  if(e.code === '23505') return 'Ya hay un paciente con ese teléfono.';
  if(e.message === 'SIN_PERMISO' || e.code === '42501') return 'Tu usuario no tiene permiso para hacer esto.';
  return 'No se ha podido guardar. Inténtalo de nuevo.';
}

// ---------- Nueva cita ----------
$('b-nueva').onclick = function(){ nuevaCita({dia:dia}) };
function nuevaCita(pre){
  var pros = D.pros.filter(function(x){ return x.activo });
  var pid = pre.profesional_id || (Y.rol === 'profesional' ? Y.profesional_id : (pros[0] && pros[0].id));
  abrir('<h3>Nueva cita</h3>' +
    '<div id="n-pac"><label for="n-buscar">Paciente<input type="search" id="n-buscar" placeholder="Nombre o teléfono" autocomplete="off"></label><div class="sugs" id="n-sugs" hidden></div></div>' +
    '<div id="n-nuevo" hidden><div class="fila2"><label for="n-nombre">Nombre y apellido<input type="text" id="n-nombre" maxlength="80"></label><label for="n-tel">Móvil<input type="tel" id="n-tel" inputmode="tel"></label></div></div>' +
    '<div class="fila2"><label for="n-pro">Profesional<select id="n-pro">' + pros.map(function(x){ return '<option value="' + x.id + '"' + (x.id === pid ? ' selected' : '') + '>' + esc(x.nombre) + '</option>' }).join('') + '</select></label>' +
    '<label for="n-serv">Servicio<select id="n-serv"></select></label></div>' +
    '<div class="fila2"><label for="n-dia">Día<input type="date" id="n-dia" value="' + (pre.dia || dia) + '"></label><label for="n-hora">Hora<input type="time" id="n-hora" step="900" value="' + (pre.hora || '') + '"></label></div>' +
    '<label for="n-nota">Nota interna <small style="font-weight:400;color:var(--muted)">(opcional)</small><input type="text" id="n-nota" maxlength="200"></label>' +
    '<p class="error" id="c-err" hidden></p>' +
    '<div class="acciones"><button class="btn sec" type="button" id="n-cancel">Cancelar</button><button class="btn" type="button" id="n-ok">Guardar cita</button></div>');
  var elegido = null, t = null;
  function servs(){ var p = $('n-pro').value; var ids = D.sp.filter(function(x){ return x.profesional_id === p }).map(function(x){ return x.servicio_id });
    $('n-serv').innerHTML = D.servs.filter(function(s){ return s.activo && ids.indexOf(s.id) > -1 }).map(function(s){ return '<option value="' + s.id + '">' + esc(s.nombre) + ' (' + s.duracion_min + ' min)</option>' }).join('') || '<option value="">Este profesional no tiene servicios</option>' }
  servs(); $('n-pro').onchange = servs;
  $('n-cancel').onclick = cerrar;
  $('n-buscar').oninput = function(){
    var q = this.value.trim(); clearTimeout(t);
    if(q.length < 2){ $('n-sugs').hidden = true; return }
    t = setTimeout(function(){
      var dig = q.replace(/\D/g,''), filtro = dig.length >= 3 ? 'telefono.ilike.*' + dig + '*' : 'nombre.ilike.*' + q.replace(/[*,()]/g,' ') + '*';
      api('pacientes?select=id,nombre,telefono&clinica_id=eq.' + Y.clinica.id + '&or=(' + encodeURIComponent(filtro) + ')&order=nombre&limit=8').then(function(r){
        var box = $('n-sugs'); box.hidden = false;
        box.innerHTML = r.map(function(p){ return '<button type="button" data-id="' + p.id + '" data-n="' + esc(p.nombre) + '"><span>' + esc(p.nombre) + '</span><span style="color:var(--muted)">' + esc(p.telefono) + '</span></button>' }).join('') +
          '<button type="button" data-nuevo="1"><span><b>+ Paciente nuevo</b>' + (dig.length < 3 ? ': ' + esc(q) : '') + '</span></button>';
      });
    }, 250);
  };
  $('n-sugs').onclick = function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    if(b.dataset.nuevo){ var q = $('n-buscar').value.trim(); elegido = null; $('n-pac').hidden = true; $('n-nuevo').hidden = false;
      if(/\d{3}/.test(q)) $('n-tel').value = q; else $('n-nombre').value = q; $('n-nombre').focus(); return }
    elegido = {id:b.dataset.id, nombre:b.dataset.n};
    $('n-pac').innerHTML = '<div class="elegido"><b>' + esc(elegido.nombre) + '</b><button class="copiar" type="button" id="n-otro">Cambiar</button></div>';
    $('n-otro').onclick = function(){ nuevaCita({profesional_id:$('n-pro').value, hora:$('n-hora').value, dia:$('n-dia').value}) };
  };
  $('n-ok').onclick = function(){
    var err = $('c-err'), b = this; err.hidden = true;
    var d = $('n-dia').value, hh = $('n-hora').value, sv = $('n-serv').value;
    if(!d || !hh || !sv){ err.textContent = 'Falta el día, la hora o el servicio.'; err.hidden = false; return }
    if(!elegido && $('n-nuevo').hidden){ err.textContent = 'Elige un paciente o crea uno nuevo.'; err.hidden = false; return }
    b.disabled = true;
    var paciente = elegido ? Promise.resolve(elegido.id) :
      api('pacientes', {metodo:'POST', devolver:true, cuerpo:{clinica_id:Y.clinica.id, nombre:$('n-nombre').value.trim(), telefono:$('n-tel').value.trim(), origen:'recepcion'}}).then(function(r){ return r[0].id });
    paciente.then(function(pid){
      return api('citas', {metodo:'POST', devolver:true, cuerpo:{clinica_id:Y.clinica.id, paciente_id:pid, profesional_id:$('n-pro').value, servicio_id:sv,
        inicio:aFecha(d, hh).toISOString(), estado:'confirmada', origen:'recepcion', nota:$('n-nota').value.trim() || null}});
    }).then(function(){ cerrar(); avisar('Cita guardada'); if(d !== dia){ dia = d; pintarDia() } else cargarDia() })
      .catch(function(e){ err.textContent = errTexto(e); err.hidden = false; b.disabled = false });
  };
}


// ---------- Reseñas: pedirlas por WhatsApp con un botón ----------
var WA_ICO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.9-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';
function tokenNuevo(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2) }).join('') }
function textoResena(nombre, cuando, enlace){
  var n = (nombre || '').trim().split(' ')[0];
  return 'Hola' + (n ? ' ' + n : '') + ', gracias por venir ' + cuando + ' a ' + Y.clinica.nombre + '. ' +
    '¿Nos dejas tu opinión en Google? Es un minuto y nos ayuda mucho a que otras personas nos encuentren:\n' + enlace + '\n¡Gracias!';
}
function cuandoTxt(d){ var k = diaDe(d), hoy = diaDe(new Date()); if(k === hoy) return 'hoy'; if(k === sumaDias(hoy,-1)) return 'ayer'; return 'el ' + new Intl.DateTimeFormat('es-ES',{weekday:'long',timeZone:tz()}).format(d) }
function cargarResenas(){
  var box = $('res'), url = Y.clinica.google_resena_url;
  if(!url){
    box.innerHTML = '<div class="r-card"><h3>Falta el enlace de reseñas de Google</h3><p>Es el enlace que abre directamente la ventana de «Escribir una reseña» de la clínica. Se saca en el Perfil de Empresa de Google → «Pedir reseñas».</p>' +
      (Y.rol === 'dueno' ? '<input type="text" id="r-url" placeholder="https://g.page/r/…/review"><button class="btn" type="button" id="r-url-ok">Guardar enlace</button><p class="error" id="c-err" hidden></p>' : '<p>Pídeselo al dueño de la clínica.</p>') + '</div>';
    if(Y.rol === 'dueno') $('r-url-ok').onclick = function(){
      var v = $('r-url').value.trim(); if(!/^https:\/\/(g\.page|search\.google\.com|www\.google\.com|maps\.app\.goo\.gl|goo\.gl)\//.test(v)){ var x = $('c-err'); x.textContent = 'Pega el enlace de Google (empieza por https://g.page/… o https://search.google.com/…).'; x.hidden = false; return }
      api('clinicas?id=eq.' + Y.clinica.id, {metodo:'PATCH', devolver:true, cuerpo:{google_resena_url:v}}).then(function(){ Y.clinica.google_resena_url = v; avisar('Enlace guardado'); cargarResenas() });
    };
    return;
  }
  box.innerHTML = '<p class="vacio">Cargando…</p>';
  var desde = new Date(Date.now() - 7*864e5).toISOString(), hace60 = new Date(Date.now() - 60*864e5).toISOString(), mes = aFecha(diaDe(new Date()).slice(0,8) + '01', '00:00').toISOString();
  Promise.all([
    api('citas?select=id,inicio,fin,estado,paciente_id,profesional_id,pacientes(nombre,telefono,acepta_whatsapp)&clinica_id=eq.' + Y.clinica.id + '&estado=in.(hecha,confirmada,pendiente)&fin=lt.' + encodeURIComponent(new Date().toISOString()) + '&inicio=gte.' + encodeURIComponent(desde) + '&order=inicio.desc'),
    api('resenas?select=cita_id,paciente_id,pedida,pulsada&clinica_id=eq.' + Y.clinica.id + '&pedida=gte.' + encodeURIComponent(hace60))
  ]).then(function(x){
    var citas = x[0], res = x[1], pedidos = {}, porCita = {};
    res.forEach(function(r){ if(r.paciente_id) pedidos[r.paciente_id] = r; if(r.cita_id) porCita[r.cita_id] = r });
    var vistos = {}, pendientes = [], hechas = [];
    citas.forEach(function(c){
      if(!c.pacientes || vistos[c.paciente_id]) return; vistos[c.paciente_id] = 1;
      if(c.estado !== 'hecha' && c.estado !== 'confirmada') return;
      if(porCita[c.id] || pedidos[c.paciente_id]) hechas.push({c:c, r:porCita[c.id] || pedidos[c.paciente_id]});
      else if(c.pacientes.acepta_whatsapp !== false) pendientes.push(c);
    });
    var delMes = res.filter(function(r){ return r.pedida >= mes }), pulsadas = delMes.filter(function(r){ return r.pulsada }).length;
    var h = '<div class="r-cab"><span class="pill"><b>' + pendientes.length + '</b> por pedir</span><span class="pill"><b>' + delMes.length + '</b> pedidas este mes</span><span class="pill"><b>' + pulsadas + '</b> abrieron el enlace</span></div>';
    h += '<p class="r-tit">Por pedir · últimos 7 días</p><div class="lista">';
    if(!pendientes.length) h += '<p class="vacio">No hay nadie pendiente. Las citas aparecen aquí al terminar.</p>';
    pendientes.forEach(function(c){
      var tk = tokenNuevo(), enlace = location.origin + '/resena/?t=' + tk, msg = textoResena(c.pacientes.nombre, cuandoTxt(new Date(c.inicio)), enlace);
      var wa = 'https://wa.me/' + c.pacientes.telefono.replace(/\D/g,'') + '?text=' + encodeURIComponent(msg);
      h += '<div class="r-fila" data-c="' + c.id + '"><span class="n">' + esc(c.pacientes.nombre) + '</span><span class="s">' + esc(cuandoTxt(new Date(c.inicio))) + ' · ' + horaDe(new Date(c.inicio)) + (c.estado !== 'hecha' ? ' · sin marcar como hecha' : '') + '</span>' +
           '<a class="r-enviar" href="' + esc(wa) + '" target="_blank" rel="noopener" data-c="' + c.id + '" data-p="' + c.paciente_id + '" data-t="' + tk + '">' + WA_ICO + 'Enviar</a>' +
           '<div class="msg">' + esc(msg) + '</div></div>';
    });
    h += '</div>';
    if(hechas.length){
      h += '<p class="r-tit">Ya pedidas</p><div class="lista">' + hechas.map(function(o){ return '<div class="r-fila"><span class="n">' + esc(o.c.pacientes.nombre) + '</span><span class="s">Pedida ' + esc(cuandoTxt(new Date(o.r.pedida))) + (o.r.pulsada ? ' · abrió el enlace' : '') + '</span><span class="r-hecha">' + (o.r.pulsada ? '★ Abierta' : '✓ Enviada') + '</span></div>' }).join('') + '</div>';
    }
    h += '<p style="color:var(--muted);font-size:.85rem;margin:4px 2px">Se pide a todos los pacientes y sin ofrecer nada a cambio: es lo que permite Google. Si alguien no quiere WhatsApp, quítalo en su ficha de paciente.</p>';
    box.innerHTML = h;
  }).catch(function(e){ box.innerHTML = '<p class="error">No se han podido cargar las reseñas.</p>'; console.error(e) });
}
$('res').addEventListener('click', function(ev){
  var a = ev.target.closest('.r-enviar'); if(!a) return;
  api('resenas', {metodo:'POST', cuerpo:{clinica_id:Y.clinica.id, cita_id:a.dataset.c, paciente_id:a.dataset.p, token:a.dataset.t}})
    .then(function(){ var f = a.closest('.r-fila'); a.outerHTML = '<span class="r-hecha">✓ Enviada</span>'; if(f) f.querySelector('.msg').remove(); setTimeout(cargarResenas, 4000) })
    .catch(function(e){ avisar('No se ha podido apuntar el envío'); console.error(e) });
});

// ---------- Pacientes ----------
function vista(v){
  ['agenda','pac','res'].forEach(function(k){ $('t-' + k).setAttribute('aria-pressed', v === k); $('mn-' + k).setAttribute('aria-pressed', v === k); $('v-' + k).hidden = v !== k });
  $('m-fab').hidden = !gestion() || v !== 'agenda'; scrollTo(0,0);
  if(v === 'pac') buscarPac(); if(v === 'res') cargarResenas();
}
$('t-agenda').onclick = function(){ vista('agenda') };
$('t-pac').onclick = function(){ vista('pac') };
$('t-res').onclick = function(){ vista('res') };
$('mn-res').onclick = function(){ vista('res') };
$('sel-clinica').onchange = function(){ try{ localStorage.setItem('panel-clinica', this.value) }catch(e){} location.reload() };
var tp = null; $('p-buscar').oninput = function(){ clearTimeout(tp); tp = setTimeout(buscarPac, 250) };
function buscarPac(){
  var q = $('p-buscar').value.trim(), dig = q.replace(/\D/g,''), f = '';
  if(q.length >= 2) f = '&or=(' + encodeURIComponent(dig.length >= 3 ? 'telefono.ilike.*' + dig + '*' : 'nombre.ilike.*' + q.replace(/[*,()]/g,' ') + '*') + ')';
  api('pacientes?select=id,nombre,telefono,email,creado&clinica_id=eq.' + Y.clinica.id + f + '&order=nombre&limit=60').then(function(r){
    $('p-lista').innerHTML = r.length ? r.map(function(p){ return '<button type="button" class="fila" data-id="' + p.id + '"><span class="n">' + esc(p.nombre) + '</span><span class="t">' + esc(p.telefono) + '</span></button>' }).join('')
      : '<p class="vacio">' + (q ? 'Ningún paciente coincide con «' + esc(q) + '».' : 'Aún no hay pacientes. Aparecerán al dar la primera cita.') + '</p>';
  }).catch(function(e){ console.error(e) });
}
$('p-lista').onclick = function(ev){ var b = ev.target.closest('.fila'); if(b) verPaciente(b.dataset.id) };
function verPaciente(id){
  Promise.all([api('pacientes?select=*&id=eq.' + id), api('citas?select=id,inicio,estado,servicio_id,profesional_id&paciente_id=eq.' + id + '&order=inicio.desc&limit=30')]).then(function(x){
    var p = x[0][0], cs = x[1]; if(!p) return;
    var fut = cs.filter(function(c){ return new Date(c.inicio) > new Date() && c.estado !== 'anulada' }).length, nv = cs.filter(function(c){ return c.estado === 'no_vino' }).length;
    abrir('<h3>' + esc(p.nombre) + '</h3>' +
      (gestion() ? '<div class="fila2"><label for="pp-n">Nombre<input type="text" id="pp-n" value="' + esc(p.nombre) + '"></label><label for="pp-t">Móvil<input type="tel" id="pp-t" value="' + esc(p.telefono) + '"></label></div>' +
        '<label for="pp-e">Email<input type="email" id="pp-e" value="' + esc(p.email || '') + '"></label>' +
        '<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="pp-wa"' + (p.acepta_whatsapp ? ' checked' : '') + '> Acepta recordatorios por WhatsApp</label>' : '<div class="dato"><small>Móvil</small><b>' + esc(p.telefono) + '</b></div>') +
      '<div class="resumen-dia" style="padding:0"><span class="pill"><b>' + cs.length + '</b> citas</span><span class="pill"><b>' + fut + '</b> próximas</span><span class="pill"><b>' + nv + '</b> no vino</span></div>' +
      '<div class="lista">' + (cs.length ? cs.map(function(c){ var s = D.servs.find(function(v){ return v.id === c.servicio_id }) || {}, i = new Date(c.inicio);
        return '<div class="fila"><span>' + esc(largo(diaDe(i))) + ' · ' + horaDe(i) + '<br><span style="color:var(--muted)">' + esc(s.nombre || '') + '</span></span><span class="t"><span class="est ' + c.estado + '">' + EST[c.estado] + '</span></span></div>' }).join('') : '<p class="vacio">Sin citas.</p>') + '</div>' +
      '<p class="error" id="c-err" hidden></p>' +
      '<div class="acciones"><button class="btn sec" type="button" id="pp-cerrar">Cerrar</button>' + (gestion() ? '<button class="btn" type="button" id="pp-ok">Guardar</button>' : '') + '</div>');
    $('pp-cerrar').onclick = cerrar;
    if(gestion()) $('pp-ok').onclick = function(){
      api('pacientes?id=eq.' + id, {metodo:'PATCH', devolver:true, cuerpo:{nombre:$('pp-n').value.trim(), telefono:$('pp-t').value.trim(), email:$('pp-e').value.trim() || null, acepta_whatsapp:$('pp-wa').checked}})
        .then(function(){ cerrar(); avisar('Paciente guardado'); buscarPac() })
        .catch(function(e){ var x = $('c-err'); x.textContent = errTexto(e); x.hidden = false });
    };
  });
}

// ---------- Inicio ----------
S = cargarSesion();
if(S) arrancar(); else $('v-login').hidden = false;
})();
</script>
