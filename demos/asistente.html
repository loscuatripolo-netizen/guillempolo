h1 em{font-style:normal;color:var(--c)}
p.s{font-size:2.9vh;line-height:1.35;color:#3a3f45}
ul{list-style:none;margin-top:3vh;display:grid;gap:1.3vh}
li{font-size:2.5vh;font-weight:600;display:flex;gap:1.2vh;align-items:center}
li:before{content:"✓";width:3.2vh;height:3.2vh;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.8vh;flex:none}
