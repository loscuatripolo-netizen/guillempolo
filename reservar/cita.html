<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu cita</title>
<style>
:root{--ac:#0D6B5F;--bg:#F5F7F6;--card:#fff;--ink:#16211F;--muted:#5D6A67;--line:#DDE4E1;--soft:#E7F1EE;--err:#A23B22;--err-bg:#FBEAE4;--f:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:520px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:16px}
h1{font-size:1.4rem;margin:0;line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.dato{display:grid;gap:2px}.dato small{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dato b{font-size:1.1rem}
.estado{display:inline-block;width:max-content;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--soft);color:var(--ac)}
.estado.anulada{background:var(--err-bg);color:var(--err)}
.btns{display:grid;gap:10px}
button{font:700 1rem var(--f);border-radius:12px;padding:15px;min-height:52px;cursor:pointer}
.si{border:0;background:var(--ac);color:#fff}
.no{border:1.5px solid var(--line);background:var(--card);color:var(--err)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.aviso{margin:0;color:var(--muted);font-size:.92rem}
.seguro{background:var(--err-bg);border-radius:12px;padding:14px;display:grid;gap:10px}
.error{background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 12px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <h1 id="tit">Tu cita</h1>
  <section class="card" id="card" hidden>
    <span class="estado" id="estado"></span>
    <div class="dato"><small>Cuándo</small><b id="cuando"></b></div>
    <div class="dato"><small>Qué</small><b id="que"></b></div>
    <div class="dato"><small>Dónde</small><b id="donde"></b></div>
    <div class="btns" id="btns">
      <button class="si" id="confirmar" type="button">Confirmo que voy</button>
      <button class="no" id="anular" type="button">No puedo ir: anular la cita</button>
    </div>
    <div class="seguro" id="seguro" hidden>
      <b>¿Seguro que quieres anularla?</b>
      <span class="aviso">Ese hueco se le ofrecerá a otra persona.</span>
      <button class="no" id="anular-si" type="button">Sí, anular</button>
      <button class="si" id="anular-cancel" type="button">No, la mantengo</button>
    </div>
    <p class="aviso" id="pie"></p>
  </section>
  <p class="error" id="err" hidden></p>
</main>
<script src="config.js"></script>
<script>
(function(){
var CFG = window.CITAS_CFG || {}, tk = new URLSearchParams(location.search).get('t'), $ = function(i){ return document.getElementById(i) }, C;
function rpc(fn, a){ return fetch(CFG.url + '/rest/v1/rpc/' + fn, {method:'POST', headers:{'apikey':CFG.key,'Content-Type':'application/json'}, body:JSON.stringify(a)})
  .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j && j.message); return j }) }) }
function fmt(d,o){ return new Intl.DateTimeFormat('es-ES', Object.assign({timeZone:C.zona_horaria || 'Europe/Madrid'}, o)).format(d) }
function err(t){ $('err').textContent = t; $('err').hidden = false }
var TXT = {pendiente:'Pendiente de confirmar', confirmada:'Confirmada', anulada:'Anulada', hecha:'Realizada', no_vino:'No asistida'};
function pintar(){
  var d = new Date(C.inicio);
  $('tit').textContent = 'Hola, ' + C.paciente;
  $('estado').textContent = TXT[C.estado] || C.estado; $('estado').className = 'estado ' + C.estado;
  $('cuando').textContent = fmt(d,{weekday:'long',day:'numeric',month:'long'}) + ' a las ' + fmt(d,{hour:'2-digit',minute:'2-digit',hour12:false});
  $('que').textContent = C.servicio + (C.profesional ? ' · con ' + C.profesional : '');
  $('donde').textContent = C.clinica + (C.direccion ? ' · ' + C.direccion : '');
  var futura = d > new Date(), activa = futura && (C.estado === 'pendiente' || C.estado === 'confirmada');
  $('btns').hidden = !activa; $('confirmar').hidden = C.estado === 'confirmada'; $('seguro').hidden = true;
  $('pie').textContent = activa ? (C.telefono ? 'Si quieres cambiar la hora, llámanos al ' + C.telefono + '.' : '') : (C.estado === 'anulada' ? 'Si quieres otra cita, puedes pedirla de nuevo.' : '');
  $('card').hidden = false;
}
function cambiar(acc){
  rpc('cambiar_por_token', {p_token:tk, p_accion:acc}).then(function(e){ C.estado = e; pintar() })
  .catch(function(e){ err(e.message === 'CITA_PASADA' ? 'Esta cita ya ha pasado.' : 'No se ha podido guardar. Inténtalo de nuevo o llámanos.') });
}
$('confirmar').onclick = function(){ cambiar('confirmar') };
$('anular').onclick = function(){ $('btns').hidden = true; $('seguro').hidden = false };
$('anular-cancel').onclick = pintar;
$('anular-si').onclick = function(){ cambiar('anular') };
if(!tk) return err('El enlace no está completo.');
rpc('cita_por_token', {p_token:tk}).then(function(c){ if(!c) return err('No encontramos esta cita. Puede que el enlace esté mal copiado.'); C = c; pintar() })
  .catch(function(){ err('No se ha podido cargar la cita. Inténtalo en un momento.') });
})();
</script>
</body>
</html>
