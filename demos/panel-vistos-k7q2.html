<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Bocetos abiertos</title>
<style>
:root{--f:#F6F3EE;--t:#1D1C1A;--g:#6B675F;--l:#E4DED3;--v:#1F7A4D;--a:#B26B00;--b:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--g);margin:0 0 18px;font-size:14px}
.res{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.res div{background:var(--b);border:1px solid var(--l);border-radius:14px;padding:10px 14px;min-width:100px}
.res b{display:block;font-size:24px}.res span{font-size:13px;color:var(--g)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--g);margin:24px 0 8px}
.f{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--b);border:1px solid var(--l);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.f a{color:var(--t);font-weight:650;text-decoration:none}.f a:hover{text-decoration:underline}
.n{font-weight:800;font-size:20px;text-align:right}.n small{display:block;font-size:11px;font-weight:500;color:var(--g)}
.d{grid-column:1/-1;font-size:13px;color:var(--g)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:6px}
.hoy{background:#E3F4EA;color:var(--v)}.ayer{background:#FFF1DC;color:var(--a)}.mucho{background:#1D1C1A;color:#fff}
.sin .f{opacity:.65}.cargando{color:var(--g)}
button.mio{font-size:12px;padding:3px 10px;margin-left:6px}
button{font:inherit;border:1px solid var(--l);background:var(--b);border-radius:999px;padding:7px 14px;cursor:pointer}
</style></head><body><div class="w">
<h1>Bocetos abiertos</h1>
<p class="sub">Cuántas veces ha abierto cada cliente su boceto (no cuentan tus aparatos: este ya queda marcado como tuyo). <button id="re">Actualizar</button></p>
<div class="res" id="res"></div>
<div id="lista" class="cargando">Cargando…</div>
</div>
<script>
(function(){try{localStorage.setItem('gp_yo','1')}catch(e){}
var NS='gpbocetos-k7q2',API='https://abacus.jasoncameron.dev/get/'+NS+'/',HIT='https://abacus.jasoncameron.dev/hit/'+NS+'/';
function nombre(s){return s.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()})}
function dia(off){var d=new Date(Date.now()-off*864e5);return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(d).replace(/-/g,'').slice(2)}
function txtDia(off){return off===0?'hoy':off===1?'ayer':'hace '+off+' días'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hora(t){return new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'})}
function espera(ms){return new Promise(function(r){setTimeout(r,ms)})}
var L=document.getElementById('lista');
// Contadores: solo suben. Se guarda el último valor leído de cada clave y nunca se baja por un fallo de lectura.
var RAW={};try{RAW=JSON.parse(localStorage.getItem('gp_raw')||'{}')}catch(e){}
// Caché del panel: {t, d (día), filas}
function cache(){try{return JSON.parse(localStorage.getItem('gp_panel')||'null')}catch(e){return null}}
function guardar(filas){try{localStorage.setItem('gp_raw',JSON.stringify(RAW));localStorage.setItem('gp_panel',JSON.stringify({t:Date.now(),d:dia(0),filas:filas}))}catch(e){}}
// Desfase en días entre la caché y hoy (para mover «hoy» a «ayer» si los totales no han cambiado)
function desfase(c){if(!c||!c.d)return null;for(var o=0;o<8;o++)if(dia(o)===c.d)return o;return 8}
function mover(dias,o){var d=(dias||[]).slice();for(var i=0;i<o;i++)d.unshift(0);return d.slice(0,7)}

// Solo lee la pestaña que está a la vista. Si te vas a otra pestaña, se pausa y deja paso.
var ultima=0,leidas=0,fallos=0,total=0,gen=0;
function visible(){return document.visibilityState!=='hidden'}
function esperaVisible(){return visible()?Promise.resolve():new Promise(function(r){function f(){if(visible()){document.removeEventListener('visibilitychange',f);r()}}document.addEventListener('visibilitychange',f)})}
function cerrojo(){try{var c=JSON.parse(localStorage.getItem('gp_lock')||'null');return c&&c.id!==YO&&Date.now()-c.t<15000}catch(e){return false}}
var YO=Math.random().toString(36).slice(2);
function tomar(){try{localStorage.setItem('gp_lock',JSON.stringify({id:YO,t:Date.now()}))}catch(e){}}
function soltar(){try{var c=JSON.parse(localStorage.getItem('gp_lock')||'null');if(c&&c.id===YO)localStorage.removeItem('gp_lock')}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!visible())soltar()});
addEventListener('pagehide',soltar);
async function leer(k,g){for(var i=0;i<6;i++){await esperaVisible();if(g!==gen)throw 'cancelado';
  while(cerrojo()){await espera(1500);if(g!==gen)throw 'cancelado'}tomar();
  var dt=Date.now()-ultima;if(dt<380)await espera(380-dt);ultima=Date.now();
  try{var r=await fetch(API+k,{cache:'no-store'});if(r.status===404)return 0;if(r.ok){var j=await r.json();return j.value||0}if(r.status===429){await espera(10500);continue}}catch(e){}await espera(1500)}return null}
async function get(k,g){var v=await leer(k,g);leidas++;estado();if(v===null){fallos++;return RAW[k]||0}v=Math.max(v,RAW[k]||0);RAW[k]=v;return v}
function estado(){var p=document.getElementById('prog');if(p)p.textContent='Actualizando… '+leidas+(total?' / ~'+total:'')}

async function cargar(){
 var g=++gen;leidas=0;fallos=0;total=0;
 var c=cache(),o=desfase(c),prev={};
 if(c&&o!==null&&o<8)c.filas.forEach(function(f){prev[f.s]={tot:f.tot,dias:mover(f.dias,o),bruto:f.bruto}});
 if(!L.querySelector('.f')){L.className='cargando';L.textContent='Leyendo contadores…'}
 var slugs=[];
 try{var j=await fetch('https://api.github.com/repos/loscuatripolo-netizen/guillempolo/contents/demos',{cache:'no-store'}).then(function(r){return r.json()});
  slugs=j.filter(function(x){return x.type==='file'&&/\.html$/.test(x.name)&&x.name.indexOf('panel-')!==0}).map(function(x){return x.name.replace(/\.html$/,'')})}catch(e){}
 if(!slugs.length&&c)slugs=c.filas.map(function(f){return f.s});
 if(!slugs.length){L.textContent='No he podido leer la lista de bocetos.';return}
 total=slugs.length;
 try{
  // 1) Totales de todos (rápido). Si un total no ha cambiado, se reutilizan sus días de la caché.
  var filas=[],cambian=[];
  for(var q=0;q<slugs.length;q++){var s=slugs[q],k=s.slice(0,57),y=s.slice(0,54)+'-y',bruto=await get(k,g),p=prev[s];
   var yo=bruto>0?(p&&p.bruto===bruto?(RAW[y]||0):await get(y,g)):0,tot=Math.max(0,bruto-yo);
   var f={s:s,bruto:bruto,tot:tot,dias:(p&&p.bruto===bruto&&p.dias)?p.dias:[0,0,0,0,0,0,0]};
   if(tot>0&&!(p&&p.bruto===bruto&&p.dias))cambian.push(f);
   filas.push(f)}
  filas.forEach(function(f){f.ult=f.dias.findIndex(function(v){return v>0})});
  pintar(filas,cambian.length?'Totales al día. Mirando qué día se abrieron '+cambian.length+'…':null);
  // 2) Días solo de los que han cambiado
  total=leidas+cambian.length*7;
  for(var m=0;m<cambian.length;m++){var f=cambian[m],k=f.s.slice(0,57),y=f.s.slice(0,54)+'-y',dias=[],tieneYo=(RAW[y]||0)>0;
   for(var o2=0;o2<7;o2++){var v=await get(k+'-'+dia(o2),g);dias.push(Math.max(0,v-(tieneYo&&v>0?await get(y+dia(o2),g):0)))}
   f.dias=dias;f.ult=dias.findIndex(function(v){return v>0});
   // si suma más que lo visto en 7 días, el resto es de antes: ult se queda en -1 solo si no hay ninguno
  }
  guardar(filas);soltar();
  pintar(filas,(fallos?fallos+' lecturas no respondieron: se muestra el último valor conocido. ':'')+'Actualizado a las '+hora(Date.now())+'.');
 }catch(e){if(e!=='cancelado'){soltar();throw e}}
}
function pintar(filas,nota){
 filas.sort(function(a,b){var ua=a.ult<0?99:a.ult,ub=b.ult<0?99:b.ult;return (a.tot>0?0:1)-(b.tot>0?0:1)||ua-ub||b.tot-a.tot||a.s.localeCompare(b.s)});
 var abiertos=filas.filter(function(f){return f.tot>0}),hoy=filas.filter(function(f){return f.ult===0});
 document.getElementById('res').innerHTML='<div><b>'+abiertos.length+'</b><span>abiertos de '+filas.length+'</span></div><div><b>'+hoy.length+'</b><span>abiertos hoy</span></div><div><b>'+filas.filter(function(f){return f.tot>=3}).length+'</b><span>3 veces o más</span></div>';
 function fila(f){var ch='';if(f.ult===0)ch+='<span class="chip hoy">Hoy</span>';else if(f.ult===1)ch+='<span class="chip ayer">Ayer</span>';if(f.tot>=3)ch+='<span class="chip mucho">Interesado</span>';
  var det=f.tot>0?(f.ult>=0?'Última vez: '+txtDia(f.ult)+(f.dias[0]?' · hoy '+f.dias[0]+(f.dias[0]>1?' veces':' vez'):''):'Abierto hace más de una semana'):'Todavía sin abrir';
  return '<div class="f"><a href="/demos/'+esc(f.s)+'" target="_blank" rel="noopener">'+esc(nombre(f.s))+'</a><div class="n">'+f.tot+'<small>'+(f.tot===1?'vez':'veces')+'</small></div><div class="d">'+ch+det+(f.ult===0?' <button class="mio" data-s="'+esc(f.s)+'">Fue mío, quitar 1</button>':'')+'</div></div>'}
 L.className='';
 L.innerHTML=(nota?'<p class="d" id="prog">'+esc(nota)+'</p>':'')+'<h2>Abiertos</h2>'+(abiertos.map(fila).join('')||'<p class="d">Ninguno todavía.</p>')+'<div class="sin"><h2>Sin abrir</h2>'+filas.filter(function(f){return !f.tot}).map(fila).join('')+'</div>';
}
L.onclick=async function(e){var b=e.target.closest('.mio');if(!b)return;b.disabled=true;b.textContent='Quitando…';var y=b.dataset.s.slice(0,54)+'-y';await fetch(HIT+y);await fetch(HIT+y+dia(0));try{var c=JSON.parse(localStorage.getItem('gp_panel'));c.filas.forEach(function(f){if(f.s===b.dataset.s)f.bruto=-1});localStorage.setItem('gp_panel',JSON.stringify(c))}catch(e){}cargar()};
window.addEventListener('storage',function(e){if(e.key==='gp_panel'&&!visible()){var c=cache();if(c)pintar(c.filas,'Datos de las '+hora(c.t)+'.')}});
document.getElementById('re').onclick=cargar;
var c0=cache();if(c0){var o0=desfase(c0);c0.filas.forEach(function(f){f.dias=mover(f.dias,o0===null?0:Math.min(o0,7));f.ult=f.dias.findIndex(function(v){return v>0})});pintar(c0.filas,'Datos de las '+hora(c0.t)+'. Actualizando…')}
cargar();
// Se refresca solo cada 2 minutos mientras está a la vista
setInterval(function(){if(visible())cargar()},120000);
})();
</script></body></html>
